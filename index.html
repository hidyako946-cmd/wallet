<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Clown's Council</title>
    <style>
        :root {
            --bg: #0a0a0a; --card-bg: #141414; --gold: #c9a44b; --text: #e0d6c2;
            --dim: #8a8a8a; --accent: #7b5ea7; --danger: #8b3a3a; --success: #3a6b4a;
            --info: #3a6b8b; --warning: #8b7a3a; --tournament: #2a6b4a; --challenge: #8b3a6b;
            --radius: 16px; --font-md: 17px; --font-lg: 22px; --padding: 24px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, 'Segoe UI', 'Roboto', sans-serif;
            padding: var(--padding); padding-bottom: 120px; min-height: 100vh;
            -webkit-tap-highlight-color: transparent; user-select: none; font-size: var(--font-md);
        }
        .header { text-align: center; margin: 24px 0 28px; }
        .header h1 { font-size: 28px; color: var(--gold); letter-spacing: 2px; }
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
        .tabs button {
            flex: 1; min-width: 55px; padding: 12px 4px; background: var(--card-bg);
            border: 1px solid #222; color: var(--dim); font-size: 11px; font-weight: 700;
            border-radius: 12px; cursor: pointer;
        }
        .tabs button.active { background: var(--accent); color: white; border-color: var(--accent); }
        .list-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 18px;
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid #444; cursor: pointer;
        }
        .list-item h3 { font-size: var(--font-lg); }
        .list-item span { font-size: 22px; font-weight: 800; color: white; }
        .btn {
            background: var(--card-bg); border: 1px solid #333; color: white;
            padding: 16px; border-radius: 14px; font-size: var(--font-md); font-weight: 700;
            width: 100%; margin-top: 8px; cursor: pointer; text-align: center; display: block;
        }
        .btn-primary { background: var(--accent); border: none; }
        .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn-info { background: var(--info); border: none; color: white; }
        .btn-gold { background: transparent; border-color: var(--gold); color: var(--gold); }
        .btn-accent { background: transparent; border-color: var(--accent); color: var(--accent); }
        .btn-warning { background: var(--warning); border: none; color: white; }
        .btn-tournament { background: var(--tournament); border: none; color: white; }
        .btn-challenge { background: var(--challenge); border: none; color: white; }
        .btn-export { background: #1a5c2a; border: 1px solid var(--success); color: var(--success); }
        .btn-small { padding: 10px 14px; font-size: 13px; width: auto; display: inline-block; margin: 4px; }
        .btn-row { display: flex; gap: 8px; margin-top: 12px; }
        .btn-row .btn { flex: 1; }
        .back-link { color: var(--gold); margin-bottom: 14px; display: block; cursor: pointer; font-weight: 700; }
        .history-item { padding: 10px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .history-item small { color: #555; }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-accent { color: var(--accent); }
        .empty { text-align: center; margin-top: 40px; color: var(--dim); }
        .stats { font-size: 13px; color: var(--dim); margin-bottom: 14px; }
        .breadcrumb { font-size: 13px; color: var(--dim); margin-bottom: 14px; }
        .breadcrumb span { color: var(--gold); cursor: pointer; font-weight: 700; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: var(--card-bg); width: 92%; max-width: 450px; padding: 24px;
            border-radius: 20px; border: 1px solid #333; max-height: 80vh; overflow-y: auto;
        }
        .modal-box h2 { color: var(--gold); margin-bottom: 18px; font-size: 22px; }
        input, select, textarea {
            width: 100%; padding: 14px; margin: 8px 0; background: #000;
            border: 1px solid #333; color: white; border-radius: 10px; font-size: var(--font-md); outline: none;
        }
        textarea { resize: vertical; min-height: 100px; font-size: 11px; font-family: monospace; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; }
        .switch { position: relative; display: inline-block; width: 52px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; border-radius: 28px; cursor: pointer; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: 0.2s; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(24px); }
        .backup-bar {
            text-align: center; padding: 12px; margin-top: 20px;
            font-size: 11px; color: #555; border-top: 1px solid #222;
        }
        .backup-bar span { color: var(--gold); cursor: pointer; margin: 0 6px; }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--success); color: white; padding: 12px 24px;
            border-radius: 20px; font-weight: 700; z-index: 9999;
            animation: fadeInOut 2s ease;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; bottom: 0; } 15% { opacity: 1; bottom: 30px; }
            85% { opacity: 1; bottom: 30px; } 100% { opacity: 0; bottom: 0; }
        }
        .folder-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 18px;
            margin-bottom: 12px; border: 1px solid #333; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid var(--warning);
        }
        .folder-item.tournament { border-left-color: var(--tournament); }
        .folder-item.challenge { border-left-color: var(--challenge); }
        .folder-item h3 { font-size: 18px; }
        .folder-item .folder-stats { font-size: 12px; color: var(--dim); margin-top: 3px; }
        .participant-row {
            background: var(--card-bg); border-radius: 14px; padding: 16px;
            margin-bottom: 8px; border: 1px solid #222;
            display: flex; justify-content: space-between; align-items: flex-start;
            flex-wrap: wrap; gap: 8px;
        }
        .participant-row .info { flex: 1; min-width: 0; }
        .participant-row .info h4 { font-size: 16px; margin-bottom: 2px; }
        .participant-row .info .deck { font-size: 12px; color: var(--info); word-break: break-all; }
        .participant-row .info .commanders { font-size: 11px; color: var(--accent); margin-top: 2px; }
        .participant-row .actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
        .paid-badge {
            padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;
            cursor: pointer; border: 2px solid #333; min-width: 90px; text-align: center;
        }
        .paid-badge.paid { background: var(--success); border-color: var(--success); color: white; }
        .paid-badge.unpaid { background: transparent; border-color: var(--danger); color: var(--danger); }
        .prize-fund {
            background: linear-gradient(135deg, #1a3a2a, #0a1a0a);
            border: 2px solid var(--tournament); border-radius: var(--radius);
            padding: 18px; margin: 16px 0; text-align: center;
        }
        .prize-fund h3 { font-size: 14px; color: var(--dim); margin-bottom: 4px; }
        .prize-fund .amount { font-size: 30px; font-weight: 800; color: var(--gold); }
        .challenge-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 18px;
            margin-bottom: 10px; border: 1px solid #333;
            border-left: 4px solid var(--challenge);
        }
        .challenge-item.done { opacity: 0.55; border-left-color: var(--success); }
        .challenge-item h4 { font-size: 16px; color: var(--gold-light); margin-bottom: 6px; }
        .challenge-item .ch-meta { font-size: 13px; color: var(--dim); margin-bottom: 4px; }
        .challenge-item .ch-conditions { font-size: 13px; color: #ccc; margin: 8px 0; padding: 10px; background: #0a0a0a; border-radius: 8px; line-height: 1.4; }
        .done-badge {
            display: inline-block; padding: 6px 14px; border-radius: 20px;
            font-size: 13px; font-weight: 700; cursor: pointer; border: 2px solid #333;
            min-width: 100px; text-align: center;
        }
        .done-badge.completed { background: var(--success); border-color: var(--success); color: white; }
        .done-badge.pending { background: transparent; border-color: var(--challenge); color: var(--challenge); }
        .sale-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 16px;
            margin-bottom: 12px; border: 1px solid #222;
        }
        .sale-item h3 { font-size: 16px; color: var(--gold-light); margin-bottom: 4px; }
        .sale-item .oracle { font-size: 12px; color: var(--dim); margin: 6px 0; padding: 8px; background: #0a0a0a; border-radius: 8px; font-style: italic; line-height: 1.4; }
        .sale-item .price { font-size: 22px; font-weight: 800; color: white; }
        .sale-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .task-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 14px;
            margin-bottom: 8px; border: 1px solid #222;
        }
        .task-item h3 { font-size: 15px; color: var(--text); margin-bottom: 4px; }
        .task-item .task-meta { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
        .task-item .task-link { font-size: 11px; color: var(--info); word-break: break-all; }
        .task-done { opacity: 0.5; }
        .task-done h3 { text-decoration: line-through; }
        .autocomplete-wrap { position: relative; }
        .autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 10;
            background: #1a1a1a; border: 1px solid #333; border-radius: 0 0 10px 10px;
            max-height: 200px; overflow-y: auto; display: none;
        }
        .autocomplete-list div { padding: 10px 14px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #222; color: #ccc; }
        .autocomplete-list div:hover { background: var(--accent); color: white; }
    </style>
</head>
<body>

<div class="header"><h1>🎪 The Clown's Council</h1></div>

<div class="tabs">
    <button id="tabPlayers" class="active" onclick="switchTab('players')">🧙</button>
    <button id="tabSale" onclick="switchTab('sale')">💵</button>
    <button id="tabOrders" onclick="switchTab('orders')">📦</button>
    <button id="tabTasks" onclick="switchTab('tasks')">📋</button>
    <button id="tabTournaments" onclick="switchTab('tournaments')">🏆</button>
    <button id="tabChallenges" onclick="switchTab('challenges')">🔥</button>
</div>

<div id="app"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modalContent"></div></div>

<script>
// ═══════════ ЛОКАЛЬНОЕ ХРАНЕНИЕ ═══════════
var STORE = 'clown_council_data';
var appData = { players: {}, orders: [], saleCards: [], taskFolders: [], tournaments: [], challengeFolders: [] };

function loadData() {
    var raw = localStorage.getItem(STORE);
    if (raw) { try { appData = JSON.parse(raw); } catch(e) {} }
}
function saveData() { localStorage.setItem(STORE, JSON.stringify(appData)); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 9); }
function showToast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 2100);
}

// ═══════════ ЭКСПОРТ / ИМПОРТ ═══════════
function exportData() {
    var jsonStr = JSON.stringify(appData, null, 2);

    // Пробуем поделиться через Web Share API
    if (navigator.canShare) {
        var blob = new Blob([jsonStr], { type: 'application/json' });
        var file = new File([blob], 'clown_council_backup.json', { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: 'Бэкап данных' }).catch(function() {
                showCopyModal(jsonStr);
            });
            return;
        }
    }
    // Если Share API не работает — показываем модалку с копированием
    showCopyModal(jsonStr);
}

function showCopyModal(jsonStr) {
    var h = '<h2>📋 Скопируй данные</h2>';
    h += '<p style="color:var(--dim);font-size:13px;">Нажми кнопку ниже, чтобы скопировать все данные в буфер обмена. Затем вставь их в заметки или отправь себе в Telegram.</p>';
    h += '<textarea id="copyData" readonly style="height:120px;">' + jsonStr + '</textarea>';
    h += '<button class="btn btn-info" onclick="copyToClipboard()">📋 Копировать в буфер</button>';
    h += '<p style="color:var(--dim);font-size:11px;margin-top:8px;">После копирования отправь текст себе в Telegram или сохрани в заметки.</p>';
    h += '<button class="btn" onclick="closeModal()">Закрыть</button>';
    openModal(h);
}

function copyToClipboard() {
    var textarea = document.getElementById('copyData');
    if (!textarea) return;
    textarea.select();
    textarea.setSelectionRange(0, 99999);
    try {
        document.execCommand('copy');
        showToast('✅ Скопировано! Вставь в заметки или Telegram');
    } catch(e) {
        // Fallback
        navigator.clipboard.writeText(textarea.value).then(function() {
            showToast('✅ Скопировано!');
        }).catch(function() {
            showToast('⚠️ Не удалось скопировать. Выдели текст вручную.');
        });
    }
}

function importData() {
    var h = '<h2>📥 Восстановить данные</h2>';
    h += '<p style="color:var(--dim);font-size:13px;">Вставь скопированный ранее JSON-текст сюда:</p>';
    h += '<textarea id="importData" placeholder="Вставь JSON сюда..."></textarea>';
    h += '<div class="btn-row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-info" onclick="doImport()">Восстановить</button></div>';
    openModal(h);
}

function doImport() {
    var raw = document.getElementById('importData').value.trim();
    if (!raw) return alert('Вставь данные!');
    try {
        var data = JSON.parse(raw);
        appData.players = data.players || {};
        appData.orders = data.orders || [];
        appData.saleCards = data.saleCards || [];
        appData.taskFolders = data.taskFolders || [];
        appData.tournaments = data.tournaments || [];
        appData.challengeFolders = data.challengeFolders || [];
        saveData(); closeModal(); render();
        showToast('✅ Данные восстановлены!');
    } catch(e) {
        alert('❌ Ошибка в данных. Проверь формат.');
    }
}

// ═══════════ НАВИГАЦИЯ ═══════════
var currentTab = 'players', currentPlayer = null, currentFolder = null, currentTournament = null, currentChallengeFolder = null;

function switchTab(t) {
    currentTab = t; currentPlayer = null; currentFolder = null; currentTournament = null; currentChallengeFolder = null;
    var tabs = ['players','sale','orders','tasks','tournaments','challenges'];
    for (var i = 0; i < tabs.length; i++) document.getElementById('tab' + tabs[i].charAt(0).toUpperCase() + tabs[i].slice(1)).className = (t === tabs[i]) ? 'active' : '';
    render();
}
function closeModal() { document.getElementById('modal').classList.remove('active'); }
function openModal(h) { document.getElementById('modalContent').innerHTML = h; document.getElementById('modal').classList.add('active'); }
function goBack() { currentPlayer = null; render(); }
function goBackFolder() { currentFolder = null; render(); }
function goBackTournament() { currentTournament = null; render(); }
function goBackChallengeFolder() { currentChallengeFolder = null; render(); }

function render() {
    var app = document.getElementById('app'), html = '';
    if (currentTab === 'players') html = renderPlayers();
    else if (currentTab === 'sale') html = renderSale();
    else if (currentTab === 'orders') html = renderOrders();
    else if (currentTab === 'tasks') html = renderTasks();
    else if (currentTab === 'tournaments') html = renderTournaments();
    else if (currentTab === 'challenges') html = renderChallenges();
    html += '<div class="backup-bar">💾 Данные на устройстве | <span onclick="exportData()">📤 Экспорт</span> | <span onclick="importData()">📥 Импорт</span></div>';
    app.innerHTML = html;
}

// ═══════════ PLAYERS ═══════════
function renderPlayers() {
    var h = '';
    if (currentPlayer && appData.players[currentPlayer]) {
        var p = appData.players[currentPlayer];
        h += '<div class="back-link" onclick="goBack()">← Назад</div>';
        h += '<div class="list-item"><div><h3>' + currentPlayer + '</h3></div><span>' + (p.balance || 0) + ' ₽</span></div>';
        h += '<button class="btn" onclick="showAddFunds()">💰 Пополнить</button>';
        h += '<button class="btn btn-gold" onclick="showSpend()">🛒 Покупка из альбома</button>';
        h += '<button class="btn btn-accent" onclick="showOrder()">📦 Заказ под привоз</button>';
        h += '<button class="btn btn-danger" onclick="deletePlayer()">🗑 Удалить</button>';
        h += '<h3 style="margin-top:20px;color:var(--dim);">📋 История</h3>';
        if (!p.history || !p.history.length) h += '<div class="empty">Нет операций</div>';
        else {
            var hist = p.history.slice().reverse();
            for (var i = 0; i < hist.length; i++) {
                var hi = hist[i], s = '+', c = 'text-success';
                if (hi.type === 'spend') { s = '−'; c = 'text-danger'; }
                if (hi.type === 'order') { s = '🔒'; c = 'text-accent'; }
                h += '<div class="history-item"><span class="' + c + '"><b>' + s + (hi.amount || 0) + ' ₽</b></span> — ' + (hi.card || '') + '<br><small>' + (hi.date || '') + '</small></div>';
            }
        }
    } else {
        currentPlayer = null;
        h += '<button class="btn btn-primary" onclick="showAddPlayer()">+ Добавить игрока</button>';
        var n = Object.keys(appData.players).sort();
        if (!n.length) h += '<div class="empty">Пока никого нет</div>';
        else for (var i = 0; i < n.length; i++) h += '<div class="list-item" onclick="openPlayer(\'' + n[i] + '\')"><div><h3>' + n[i] + '</h3></div><span>' + (appData.players[n[i]].balance || 0) + ' ₽</span></div>';
    }
    return h;
}
function openPlayer(n) { currentPlayer = n; render(); }
function showAddPlayer() { openModal('<h2>✨ Новый игрок</h2><input id="pName" placeholder="Имя"><input id="pBal" type="number" value="0"><div class="btn-row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="addPlayer()">Создать</button></div>'); }
function addPlayer() { var n = document.getElementById('pName').value.trim(); if (!n) return alert('Введи!'); var b = parseInt(document.getElementById('pBal').value) || 0; if (appData.players[n]) return alert('Уже есть!'); appData.players[n] = { balance: b, history: b > 0 ? [{ date: new Date().toLocaleString('ru-RU'), amount: b, type: 'add', card: 'Старт' }] : [] }; saveData(); closeModal(); render(); showToast('✅ Добавлено'); }
function showAddFunds() { openModal('<h2>💰 ' + currentPlayer + '</h2><input id="amount" type="number" value="500"><input id="note" placeholder="Примечание"><div class="btn-row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="addFunds()">Зачислить</button></div>'); }
function addFunds() { var a = parseInt(document.getElementById('amount').value) || 0; if (a <= 0) return; appData.players[currentPlayer].balance += a; appData.players[currentPlayer].history.push({ date: new Date().toLocaleString('ru-RU'), amount: a, type: 'add', card: document.getElementById('note').value.trim() || 'Пополнение' }); saveData(); closeModal(); render(); showToast('✅ Пополнено'); }
function showSpend() { openModal('<h2>🛒 ' + currentPlayer + '</h2><input id="spendCard" placeholder="Карта"><input id="spendAmount" type="number"><div class="btn-row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-gold" style="background:var(--gold);color:#000;" onclick="spendFunds()">Списать</button></div>'); }
function spendFunds() { var a = parseInt(document.getElementById('spendAmount').value) || 0; if (a <= 0) return; if (appData.players[currentPlayer].balance < a) return alert('Недостаточно!'); appData.players[currentPlayer].balance -= a; appData.players[currentPlayer].history.push({ date: new Date().toLocaleString('ru-RU'), amount: a, type: 'spend', card: document.getElementById('spendCard').value.trim() || 'Карта' }); saveData(); closeModal(); render(); showToast('✅ Списано'); }
function showOrder() { openModal('<h2>📦 ' + currentPlayer + '</h2><input id="orderCard" placeholder="Карта"><input id="orderBase" type="number" placeholder="Цена" oninput="updateOrderTotal()"><div class="toggle-row"><span>+20%</span><label class="switch"><input type="checkbox" id="orderComm" checked onchange="updateOrderTotal()"><span class="slider"></span></label></div><p style="text-align:right;">Итог: <b id="orderTotal">0 ₽</b></p><div class="btn-row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-accent" style="background:var(--accent);" onclick="placeOrder()">Заказать</button></div>'); }
function updateOrderTotal() { document.getElementById('orderTotal').innerText = ((document.getElementById('orderComm').checked ? Math.round((parseInt(document.getElementById('orderBase').value) || 0) * 1.2) : (parseInt(document.getElementById('orderBase').value) || 0))) + ' ₽'; }
function placeOrder() { var c = document.getElementById('orderCard').value.trim(), b = parseInt(document.getElementById('orderBase').value) || 0, cm = document.getElementById('orderComm').checked, t = cm ? Math.round(b * 1.2) : b; if (!c || t <= 0) return alert('Заполни!'); if (appData.players[currentPlayer].balance < t) return alert('Недостаточно!'); appData.players[currentPlayer].balance -= t; appData.players[currentPlayer].history.push({ date: new Date().toLocaleString('ru-RU'), amount: t, type: 'order', card: c + ' (ЗАКАЗ)' }); appData.orders.push({ id: genId(), playerName: currentPlayer, card: c, amount: t, status: 'pending', date: new Date().toLocaleString('ru-RU') }); saveData(); closeModal(); render(); showToast('✅ Заказ создан'); }
function deletePlayer() { if (!confirm('Удалить?')) return; delete appData.players[currentPlayer]; currentPlayer = null; saveData(); render(); showToast('✅ Удалено'); }

// ═══════════ SALE ═══════════
var autocompleteTimer = null;
function renderSale() {
    var h = '', cards = appData.saleCards || [];

function renderTasks() {

function showAddChallenge() { var playerNames = Object.keys(appData.players).sort(); var h = '<h2>🔥 Челендж</h2><input id="chTitle" placeholder="Название"><textarea id="chConditions" placeholder="Условия"></textarea><input id="chTime" placeholder="Время"><select id="chPlayer"><option value="">— Выбери игрока —</option>'; for (var i = 0; i < playerNames.length; i++) h += '<option value="' + playerNames[i] + '">' + playerNames[i] + '</option>'; h += '</select><div class="btn-row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-challenge" onclick="addChallenge()">Создать</button></div>'; openModal(h); }
function addChallenge() { var title = document.getElementById('chTitle').value.trim(); if (!title) return alert('Введи название!'); var cf = appData.challengeFolders.find(function(f) { return f.id === currentChallengeFolder; }); if (!cf) return; cf.challenges.push({ id: genId(), title: title, conditions: document.getElementById('chConditions').value.trim(), time: document.getElementById('chTime').value.trim(), player: document.getElementById('chPlayer').value, done: false }); saveData(); closeModal(); render(); showToast('✅ Создано'); }
function toggleChallenge(id) { var cf = appData.challengeFolders.find(function(f) { return f.id === currentChallengeFolder; }); if (!cf) return; var ch = cf.challenges.find(function(x) { return x.id === id; }); if (ch) ch.done = !ch.done; saveData(); render(); }
function deleteChallenge(id) { if (!confirm('Удалить?')) return; var cf = appData.challengeFolders.find(function(f) { return f.id === currentChallengeFolder; }); if (!cf) return; cf.challenges = cf.challenges.filter(function(c) { return c.id !== id; }); saveData(); render(); }

// ═══════════ ЗАПУСК ═══════════
loadData(); render();
</script>
