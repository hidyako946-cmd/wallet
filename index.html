<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Clown's Council</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a; --card-bg: #141414; --gold: #c9a44b; --text: #e0d6c2;
            --dim: #8a8a8a; --accent: #7b5ea7; --danger: #8b3a3a; --success: #3a6b4a;
            --info: #3a6b8b; --warning: #8b7a3a; --tournament: #2a6b4a; --challenge: #8b3a6b;
            --radius: 20px; --font-sm: 14px; --font-md: 17px; --font-lg: 22px;
            --font-xl: 28px; --padding: 28px; --btn-padding: 18px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, 'Segoe UI', 'Roboto', sans-serif;
            padding: var(--padding); padding-bottom: 140px; min-height: 100vh;
            -webkit-tap-highlight-color: transparent; user-select: none; font-size: var(--font-md);
        }
        .header { text-align: center; margin: 28px 0 32px; }
        .header h1 { font-size: var(--font-xl); color: var(--gold); letter-spacing: 2px; }
        .tabs { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
        .tabs button {
            flex: 1; min-width: 55px; padding: 14px 6px; background: var(--card-bg);
            border: 1px solid #222; color: var(--dim); font-size: 12px; font-weight: 700;
            border-radius: 14px; cursor: pointer;
        }
        .tabs button.active { background: var(--accent); color: white; border-color: var(--accent); }
        .list-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 20px;
            margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center;
            border-left: 5px solid #444; cursor: pointer;
        }
        .list-item h3 { font-size: var(--font-lg); }
        .list-item span { font-size: 24px; font-weight: 800; color: white; }
        .folder-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 20px;
            margin-bottom: 14px; border: 1px solid #333; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 5px solid var(--warning);
        }
        .folder-item.tournament { border-left-color: var(--tournament); }
        .folder-item.challenge { border-left-color: var(--challenge); }
        .folder-item h3 { font-size: 18px; }
        .folder-item .folder-stats { font-size: var(--font-sm); color: var(--dim); margin-top: 4px; }
        .btn {
            background: var(--card-bg); border: 1px solid #333; color: white;
            padding: var(--btn-padding); border-radius: 14px; font-size: var(--font-md); font-weight: 700;
            width: 100%; margin-top: 10px; cursor: pointer; text-align: center; display: block;
        }
        .btn-primary { background: var(--accent); border: none; }
        .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn-info { background: var(--info); border: none; color: white; }
        .btn-tournament { background: var(--tournament); border: none; color: white; }
        .btn-challenge { background: var(--challenge); border: none; color: white; }
        .btn-sell-btn { background: var(--success); color: white; border: none; }
        .btn-price-btn { background: var(--accent); color: white; border: none; }
        .btn-gold { background: transparent; border-color: var(--gold); color: var(--gold); }
        .btn-accent { background: transparent; border-color: var(--accent); color: var(--accent); }
        .btn-warning { background: var(--warning); border: none; color: white; }
        .btn-small { padding: 10px 16px; font-size: 12px; width: auto; display: inline-block; margin: 4px; }
        .btn-export { background: #1a5c2a; border: 1px solid var(--success); color: var(--success); }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 999; align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: var(--card-bg); width: 92%; max-width: 480px; padding: 28px;
            border-radius: 22px; border: 1px solid #333; max-height: 80vh; overflow-y: auto;
        }
        .modal-box h2 { color: var(--gold); margin-bottom: 20px; font-size: 24px; }
        input, select, textarea {
            width: 100%; padding: 16px; margin: 10px 0; background: #000;
            border: 1px solid #333; color: white; border-radius: 12px; font-size: var(--font-md); outline: none;
        }
        textarea { resize: vertical; min-height: 90px; }
        .row { display: flex; gap: 10px; margin-top: 20px; }
        .row .btn { flex: 1; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; margin: 14px 0; }
        .switch { position: relative; display: inline-block; width: 56px; height: 30px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; border-radius: 30px; cursor: pointer; }
        .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: 0.2s; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(26px); }
        .back-link { color: var(--gold); margin-bottom: 16px; display: block; cursor: pointer; font-weight: 700; font-size: var(--font-md); }
        .history-item { padding: 10px 0; border-bottom: 1px solid #222; font-size: var(--font-sm); }
        .history-item small { color: #555; }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-accent { color: var(--accent); }
        .empty { text-align: center; margin-top: 50px; color: var(--dim); font-size: var(--font-md); }
        .stats { font-size: var(--font-sm); color: var(--dim); margin-bottom: 16px; }
        .breadcrumb { font-size: var(--font-sm); color: var(--dim); margin-bottom: 16px; }
        .breadcrumb span { color: var(--gold); cursor: pointer; font-weight: 700; }
        .sync-info { font-size: 11px; color: #555; text-align: center; margin-top: 10px; padding-bottom: 20px; }
        .sync-info span { color: var(--success); }
        .participant-row {
            background: var(--card-bg); border-radius: 14px; padding: 18px;
            margin-bottom: 10px; border: 1px solid #222;
            display: flex; justify-content: space-between; align-items: flex-start;
            flex-wrap: wrap; gap: 10px;
        }
        .participant-row .info { flex: 1; min-width: 0; }
        .participant-row .info h4 { font-size: var(--font-md); margin-bottom: 3px; }
        .participant-row .info .deck { font-size: 12px; color: var(--info); word-break: break-all; }
        .participant-row .info .commanders { font-size: 11px; color: var(--accent); margin-top: 3px; }
        .participant-row .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
        .paid-badge {
            padding: 8px 18px; border-radius: 24px; font-size: var(--font-sm); font-weight: 700;
            cursor: pointer; border: 2px solid #333; min-width: 100px; text-align: center;
        }
        .paid-badge.paid { background: var(--success); border-color: var(--success); color: white; }
        .paid-badge.unpaid { background: transparent; border-color: var(--danger); color: var(--danger); }
        .prize-fund {
            background: linear-gradient(135deg, #1a3a2a, #0a1a0a);
            border: 3px solid var(--tournament); border-radius: var(--radius);
            padding: 22px; margin: 20px 0; text-align: center;
        }
        .prize-fund h3 { font-size: var(--font-md); color: var(--dim); margin-bottom: 6px; }
        .prize-fund .amount { font-size: 34px; font-weight: 800; color: var(--gold); }
        .challenge-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 20px;
            margin-bottom: 12px; border: 1px solid #333;
            border-left: 5px solid var(--challenge);
        }
        .challenge-item.done { opacity: 0.55; border-left-color: var(--success); }
        .challenge-item h4 { font-size: var(--font-md); color: var(--gold-light); margin-bottom: 8px; }
        .challenge-item .ch-meta { font-size: var(--font-sm); color: var(--dim); margin-bottom: 6px; }
        .challenge-item .ch-conditions { font-size: var(--font-sm); color: #ccc; margin: 10px 0; padding: 12px; background: #0a0a0a; border-radius: 10px; line-height: 1.5; }
        .done-badge {
            display: inline-block; padding: 8px 18px; border-radius: 24px;
            font-size: var(--font-sm); font-weight: 700; cursor: pointer; border: 2px solid #333;
            min-width: 110px; text-align: center;
        }
        .done-badge.completed { background: var(--success); border-color: var(--success); color: white; }
        .done-badge.pending { background: transparent; border-color: var(--challenge); color: var(--challenge); }
        .sale-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 18px;
            margin-bottom: 14px; border: 1px solid #222;
        }
        .sale-item h3 { font-size: var(--font-md); color: var(--gold-light); margin-bottom: 6px; }
        .sale-item .oracle { font-size: 12px; color: var(--dim); margin: 8px 0; padding: 10px; background: #0a0a0a; border-radius: 10px; font-style: italic; line-height: 1.5; }
        .sale-item .price { font-size: 24px; font-weight: 800; color: white; }
        .sale-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .task-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 16px;
            margin-bottom: 10px; border: 1px solid #222;
        }
        .task-item h3 { font-size: var(--font-md); color: var(--text); margin-bottom: 6px; }
        .task-item .task-meta { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
        .task-item .task-link { font-size: 11px; color: var(--info); word-break: break-all; }
        .task-done { opacity: 0.5; }
        .task-done h3 { text-decoration: line-through; }
        .autocomplete-wrap { position: relative; }
        .autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 10;
            background: #1a1a1a; border: 1px solid #333; border-radius: 0 0 10px 10px;
            max-height: 200px; overflow-y: auto; display: none;
        }
        .autocomplete-list div { padding: 10px 14px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #222; color: #ccc; }
        .autocomplete-list div:hover { background: var(--accent); color: white; }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--success); color: white; padding: 14px 28px;
            border-radius: 24px; font-weight: 700; z-index: 9999; font-size: var(--font-md);
            animation: fadeInOut 2.5s ease;
        }
        .toast.error { background: var(--danger); }
        @keyframes fadeInOut {
            0% { opacity: 0; bottom: 0; } 15% { opacity: 1; bottom: 30px; }
            85% { opacity: 1; bottom: 30px; } 100% { opacity: 0; bottom: 0; }
        }
    </style>
</head>
<body>

<div class="header"><h1>🎪 The Clown's Council</h1></div>

<div class="tabs">
    <button id="tabPlayers" class="active" onclick="switchTab('players')">🧙</button>
    <button id="tabSale" onclick="switchTab('sale')">💵</button>
    <button id="tabOrders" onclick="switchTab('orders')">📦</button>
    <button id="tabTasks" onclick="switchTab('tasks')">📋</button>
    <button id="tabTournaments" onclick="switchTab('tournaments')">🏆</button>
    <button id="tabChallenges" onclick="switchTab('challenges')">🔥</button>
</div>

<div id="app"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modalContent"></div></div>

<script>
// ═══════════════ НАСТРОЙКИ ═══════════════
var GITHUB_USER = 'hidyako946-cmd';
var GITHUB_REPO = 'wallet';
var GITHUB_TOKEN = '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';
var DATA_FILE = 'data.json';

var API_URL = 'https://api.github.com/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/' + DATA_FILE;
var appData = { players: {}, orders: [], saleCards: [], taskFolders: [], tournaments: [], challengeFolders: [] };
var dataSha = null, isSaving = false, lastSync = null;

function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 9); }
function showToast(msg, isError) {
    var t = document.createElement('div'); t.className = 'toast' + (isError ? ' error' : '');
    t.textContent = msg; document.body.appendChild(t);
    setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 2600);
}

// ═══════════════ GITHUB API ═══════════════
async function loadData() {
    try {
        var resp = await fetch(API_URL, { headers: { 'Authorization': 'token ' + GITHUB_TOKEN } });
        if (!resp.ok) { if (resp.status === 404) return; throw new Error('HTTP ' + resp.status); }
        var json = await resp.json(); dataSha = json.sha;
        var content = atob(json.content.replace(/\n/g, ''));
        var parsed = JSON.parse(content);
        appData.players = parsed.players || {};
        appData.orders = parsed.orders || [];
        appData.saleCards = parsed.saleCards || [];
        appData.taskFolders = parsed.taskFolders || [];
        appData.tournaments = parsed.tournaments || [];
        appData.challengeFolders = parsed.challengeFolders || [];
        lastSync = new Date();
    } catch(e) { console.error(e); showToast('⚠️ Ошибка загрузки', true); }
}

async function saveData() {
    if (isSaving) return; isSaving = true;
    try {
        var content = btoa(unescape(encodeURIComponent(JSON.stringify(appData, null, 2))));
        var body = { message: 'Update data', content: content };
        if (dataSha) body.sha = dataSha;
        var resp = await fetch(API_URL, { method: 'PUT', headers: { 'Authorization': 'token ' + GITHUB_TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!resp.ok) { if (resp.status === 409) { await loadData(); return await saveData(); } throw new Error('HTTP ' + resp.status); }
        var json = await resp.json(); dataSha = json.content.sha; lastSync = new Date();
    } catch(e) { console.error(e); showToast('⚠️ Ошибка сохранения', true); }
    isSaving = false;
}

// ═══════════════ НАВИГАЦИЯ ═══════════════
var currentTab = 'players', currentPlayer = null, currentFolder = null, currentTournament = null, currentChallengeFolder = null;

function switchTab(t) {
    currentTab = t; currentPlayer = null; currentFolder = null; currentTournament = null; currentChallengeFolder = null;
    var tabs = ['players','sale','orders','tasks','tournaments','challenges'];
    for (var i = 0; i < tabs.length; i++) document.getElementById('tab' + tabs[i].charAt(0).toUpperCase() + tabs[i].slice(1)).className = (t === tabs[i]) ? 'active' : '';
    render();
}
function closeModal() { document.getElementById('modal').classList.remove('active'); }
function openModal(h) { document.getElementById('modalContent').innerHTML = h; document.getElementById('modal').classList.add('active'); }
function goBack() { currentPlayer = null; render(); }
function goBackFolder() { currentFolder = null; render(); }
function goBackTournament() { currentTournament = null; render(); }
function goBackChallengeFolder() { currentChallengeFolder = null; render(); }

function render() {
    var app = document.getElementById('app'), html = '';
    if (currentTab === 'players') html = renderPlayers();
    else if (currentTab === 'sale') html = renderSale();
    else if (currentTab === 'orders') html = renderOrders();
    else if (currentTab === 'tasks') html = renderTasks();
    else if (currentTab === 'tournaments') html = renderTournaments();
    else if (currentTab === 'challenges') html = renderChallenges();
    var syncText = lastSync ? 'Синхронизация: ' + lastSync.toLocaleString('ru-RU') : 'Не синхронизировано';
    html += '<div class="sync-info">☁️ GitHub Cloud | <span>' + syncText + '</span></div>';
    app.innerHTML = html;
}

// ═══════════════ PLAYERS ═══════════════
function renderPlayers() {
    var h = '';
    if (currentPlayer && appData.players[currentPlayer]) {
        var p = appData.players[currentPlayer];
        h += '<div class="back-link" onclick="goBack()">← Назад</div>';
        h += '<div class="list-item"><div><h3>' + currentPlayer + '</h3></div><span>' + (p.balance || 0) + ' ₽</span></div>';
        h += '<button class="btn" onclick="showAddFunds()">💰 Пополнить</button>';
        h += '<button class="btn btn-gold" onclick="showSpend()">🛒 Покупка из альбома</button>';
        h += '<button class="btn btn-accent" onclick="showOrder()">📦 Заказ под привоз</button>';
        h += '<button class="btn btn-danger" onclick="deletePlayer()">🗑 Удалить</button>';
        h += '<h3 style="margin-top:24px;color:var(--dim);">📋 История</h3>';
        if (!p.history || !p.history.length) h += '<div class="empty">Нет операций</div>';
        else {
            var hist = p.history.slice().reverse();
            for (var i = 0; i < hist.length; i++) {
                var hi = hist[i], s = '+', c = 'text-success';
                if (hi.type === 'spend') { s = '−'; c = 'text-danger'; }
                if (hi.type === 'order') { s = '🔒'; c = 'text-accent'; }
                h += '<div class="history-item"><span class="' + c + '"><b>' + s + (hi.amount || 0) + ' ₽</b></span> — ' + (hi.card || '') + '<br><small>' + (hi.date || '') + '</small></div>';
            }
        }
    } else {
        currentPlayer = null;
        h += '<button class="btn btn-primary" onclick="showAddPlayer()">+ Добавить игрока</button>';
        var n = Object.keys(appData.players).sort();
        if (!n.length) h += '<div class="empty">Пока никого нет</div>';
        else for (var i = 0; i < n.length; i++) h += '<div class="list-item" onclick="openPlayer(\'' + n[i] + '\')"><div><h3>' + n[i] + '</h3></div><span>' + (appData.players[n[i]].balance || 0) + ' ₽</span></div>';
    }
    return h;
}
function openPlayer(n) { currentPlayer = n; render(); }
function showAddPlayer() { openModal('<h2>✨ Новый игрок</h2><input id="pName" placeholder="Имя"><input id="pBal" type="number" value="0"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="addPlayer()">Создать</button></div>'); }
async function addPlayer() { var n = document.getElementById('pName').value.trim(); if (!n) return alert('Введи!'); var b = parseInt(document.getElementById('pBal').value) || 0; if (appData.players[n]) return alert('Уже есть!'); appData.players[n] = { balance: b, history: b > 0 ? [{ date: new Date().toLocaleString('ru-RU'), amount: b, type: 'add', card: 'Старт' }] : [] }; closeModal(); await saveData(); render(); showToast('✅ Добавлено'); }
function showAddFunds() { openModal('<h2>💰 ' + currentPlayer + '</h2><input id="amount" type="number" value="500"><input id="note" placeholder="Примечание"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="addFunds()">Зачислить</button></div>'); }
async function addFunds() { var a = parseInt(document.getElementById('amount').value) || 0; if (a <= 0) return; appData.players[currentPlayer].balance += a; appData.players[currentPlayer].history.push({ date: new Date().toLocaleString('ru-RU'), amount: a, type: 'add', card: document.getElementById('note').value.trim() || 'Пополнение' }); closeModal(); await saveData(); render(); showToast('✅ Пополнено'); }
function showSpend() { openModal('<h2>🛒 ' + currentPlayer + '</h2><input id="spendCard" placeholder="Карта"><input id="spendAmount" type="number"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-gold" style="background:var(--gold);color:#000;" onclick="spendFunds()">Списать</button></div>'); }
async function spendFunds() { var a = parseInt(document.getElementById('spendAmount').value) || 0; if (a <= 0) return; if (appData.players[currentPlayer].balance < a) return alert('Недостаточно!'); appData.players[currentPlayer].balance -= a; appData.players[currentPlayer].history.push({ date: new Date().toLocaleString('ru-RU'), amount: a, type: 'spend', card: document.getElementById('spendCard').value.trim() || 'Карта' }); closeModal(); await saveData(); render(); showToast('✅ Списано'); }
function showOrder() { openModal('<h2>📦 ' + currentPlayer + '</h2><input id="orderCard" placeholder="Карта"><input id="orderBase" type="number" placeholder="Цена" oninput="updateOrderTotal()"><div class="toggle-row"><span>+20%</span><label class="switch"><input type="checkbox" id="orderComm" checked onchange="updateOrderTotal()"><span class="slider"></span></label></div><p style="text-align:right;">Итог: <b id="orderTotal">0 ₽</b></p><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-accent" style="background:var(--accent);" onclick="placeOrderFromPlayer()">Заказать</button></div>'); }
function updateOrderTotal() { document.getElementById('orderTotal').innerText = ((document.getElementById('orderComm').checked ? Math.round((parseInt(document.getElementById('orderBase').value) || 0) * 1.2) : (parseInt(document.getElementById('orderBase').value) || 0))) + ' ₽'; }
async function placeOrderFromPlayer() { var c = document.getElementById('orderCard').value.trim(), b = parseInt(document.getElementById('orderBase').value) || 0, cm = document.getElementById('orderComm').checked, t = cm ? Math.round(b * 1.2) : b; if (!c || t <= 0) return alert('Заполни!'); if (appData.players[currentPlayer].balance < t) return alert('Недостаточно!'); appData.players[currentPlayer].balance -= t; appData.players[currentPlayer].history.push({ date: new Date().toLocaleString('ru-RU'), amount: t, type: 'order', card: c + ' (ЗАКАЗ)' }); appData.orders.push({ id: genId(), playerName: currentPlayer, card: c, amount: t, status: 'pending', date: new Date().toLocaleString('ru-RU') }); closeModal(); await saveData(); render(); showToast('✅ Заказ создан'); }
async function deletePlayer() { if (!confirm('Удалить?')) return; delete appData.players[currentPlayer]; currentPlayer = null; await saveData(); render(); showToast('✅ Удалено'); }

// ═══════════════ SALE ═══════════════
var autocompleteTimer = null;
function renderSale() {
    var h = '', cards = appData.saleCards || [];
    h += '<div class="stats">💵 Карт: <b>' + cards.length + '</b></div>';
    h += '<button class="btn btn-sell-btn" onclick="showAddSaleCard()">+ Добавить карту</button>';
    if (cards.length) h += '<button class="btn btn-danger" style="margin-top:10px;" onclick="clearSale()">🗑 Очистить</button>';
    if (!cards.length) h += '<div class="empty">Пусто</div>';
    else for (var i = 0; i < cards.length; i++) {
        var c = cards[i];
        h += '<div class="sale-item"><h3>🃏 ' + (c.name || '???') + '</h3>';

    h += '<button class="btn btn-challenge" onclick="showAddChallengeFolder()">🔥 Новая папка челенджей</button>';
    if (!folds.length) h += '<div class="empty">Нет папок</div>';
    else for (var i = 0; i < folds.length; i++) { var f = folds[i]; var cc = (f.challenges || []).length; var cd = (f.challenges || []).filter(function(c) { return c.done; }).length; h += '<div class="folder-item challenge" onclick="openChallengeFolder(\'' + f.id + '\')"><div><h3>🔥 ' + (f.name || 'Без имени') + '</h3><div class="folder-stats">' + cc + ' челенджей, ' + cd + ' выполнено</div></div><span>→</span></div>'; }
    return h;
}
function openChallengeFolder(id) { currentChallengeFolder = id; render(); }
function showAddChallengeFolder() { openModal('<h2>🔥 Новая папка</h2><input id="cfName" placeholder="Название"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-challenge" onclick="addChallengeFolder()">Создать</button></div>'); }
async function addChallengeFolder() { var n = document.getElementById('cfName').value.trim(); if (!n) return; appData.challengeFolders.push({ id: genId(), name: n, challenges: [] }); closeModal(); await saveData(); render(); showToast('✅ Папка создана'); }
async function deleteChallengeFolder(id) { if (!confirm('Удалить?')) return; appData.challengeFolders = appData.challengeFolders.filter(function(f) { return f.id !== id; }); currentChallengeFolder = null; await saveData(); render(); showToast('✅ Удалено'); }
function showAddChallenge() { var playerNames = Object.keys(appData.players).sort(); var h = '<h2>🔥 Новый челендж</h2><input id="chTitle" placeholder="Название"><textarea id="chConditions" placeholder="Условия"></textarea><input id="chTime" placeholder="Время"><select id="chPlayer"><option value="">— Выбери игрока —</option>'; for (var i = 0; i < playerNames.length; i++) h += '<option value="' + playerNames[i] + '">' + playerNames[i] + '</option>'; h += '</select><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-challenge" onclick="addChallenge()">Создать</button></div>'; openModal(h); }
async function addChallenge() { var title = document.getElementById('chTitle').value.trim(); if (!title) return alert('Введи название!'); var cf = appData.challengeFolders.find(function(f) { return f.id === currentChallengeFolder; }); if (!cf) return; cf.challenges.push({ id: genId(), title: title, conditions: document.getElementById('chConditions').value.trim(), time: document.getElementById('chTime').value.trim(), player: document.getElementById('chPlayer').value, done: false }); closeModal(); await saveData(); render(); showToast('✅ Челендж создан'); }
async function toggleChallenge(id) { var cf = appData.challengeFolders.find(function(f) { return f.id === currentChallengeFolder; }); if (!cf) return; var ch = cf.challenges.find(function(x) { return x.id === id; }); if (ch) ch.done = !ch.done; await saveData(); render(); }
async function deleteChallenge(id) { if (!confirm('Удалить?')) return; var cf = appData.challengeFolders.find(function(f) { return f.id === currentChallengeFolder; }); if (!cf) return; cf.challenges = cf.challenges.filter(function(c) { return c.id !== id; }); await saveData(); render(); }

// ═══════════════ ЗАПУСК ═══════════════
loadData().then(function() { render(); });
</script>
