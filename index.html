<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, target-densitydpi=device-dpi">
    <title>The Clown's Council</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a; --card-bg: #141414; --gold: #c9a44b; --gold-light: #e0c878;
            --text: #e0d6c2; --dim: #8a8a8a; --accent: #7b5ea7; --danger: #8b3a3a;
            --success: #3a6b4a; --info: #3a6b8b; --warning: #8b7a3a; --tournament: #2a6b4a;
            --challenge: #8b3a6b; --radius: 20px;
            /* S25 ULTRA OPTIMIZED */
            --font-xs: 12px; --font-sm: 14px; --font-md: 17px; --font-lg: 22px;
            --font-xl: 28px; --font-huge: 34px;
            --padding: 28px;
            --btn-padding: 18px;
            --input-padding: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, 'Segoe UI', 'Roboto', system-ui, sans-serif;
            padding: var(--padding); padding-bottom: 140px; min-height: 100vh;
            -webkit-tap-highlight-color: transparent; user-select: none;
            font-size: var(--font-md);
        }
        .header { text-align: center; margin: 28px 0 32px; }
        .header h1 { font-size: var(--font-xl); color: var(--gold); letter-spacing: 2px; }
        .tabs { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
        .tabs button {
            flex: 1; min-width: 55px; padding: 14px 6px; background: var(--card-bg);
            border: 1px solid #222; color: var(--dim); font-size: var(--font-xs); font-weight: 700;
            border-radius: 14px; cursor: pointer; letter-spacing: 0.5px;
        }
        .tabs button.active { background: var(--accent); color: white; border-color: var(--accent); transform: scale(1.03); }
        .list-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 20px;
            margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center;
            border-left: 5px solid #444; cursor: pointer;
        }
        .list-item h3 { font-size: var(--font-lg); }
        .list-item span { font-size: 24px; font-weight: 800; color: white; }
        .folder-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 20px;
            margin-bottom: 14px; border: 1px solid #333; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 5px solid var(--warning);
        }
        .folder-item.tournament { border-left-color: var(--tournament); }
        .folder-item.challenge { border-left-color: var(--challenge); }
        .folder-item h3 { font-size: 18px; }
        .folder-item .folder-stats { font-size: var(--font-sm); color: var(--dim); margin-top: 4px; }
        .participant-row {
            background: var(--card-bg); border-radius: 14px; padding: 18px;
            margin-bottom: 10px; border: 1px solid #222;
            display: flex; justify-content: space-between; align-items: flex-start;
            flex-wrap: wrap; gap: 10px;
        }
        .participant-row .info { flex: 1; min-width: 0; }
        .participant-row .info h4 { font-size: var(--font-md); margin-bottom: 3px; }
        .participant-row .info .deck { font-size: var(--font-xs); color: var(--info); word-break: break-all; }
        .participant-row .info .commanders { font-size: 11px; color: var(--accent); margin-top: 3px; }
        .participant-row .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
        .paid-badge {
            padding: 8px 18px; border-radius: 24px; font-size: var(--font-sm); font-weight: 700;
            cursor: pointer; border: 2px solid #333; min-width: 100px; text-align: center;
            transition: all 0.2s;
        }
        .paid-badge.paid { background: var(--success); border-color: var(--success); color: white; }
        .paid-badge.unpaid { background: transparent; border-color: var(--danger); color: var(--danger); }
        .challenge-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 20px;
            margin-bottom: 12px; border: 1px solid #333;
            border-left: 5px solid var(--challenge);
        }
        .challenge-item.done { opacity: 0.55; border-left-color: var(--success); }
        .challenge-item h4 { font-size: var(--font-md); color: var(--gold-light); margin-bottom: 8px; }
        .challenge-item .ch-meta { font-size: var(--font-sm); color: var(--dim); margin-bottom: 6px; }
        .challenge-item .ch-meta span { margin-right: 12px; }
        .challenge-item .ch-conditions { font-size: var(--font-sm); color: #ccc; margin: 10px 0; padding: 12px; background: #0a0a0a; border-radius: 10px; line-height: 1.5; }
        .challenge-item .ch-player { font-size: var(--font-sm); color: var(--info); font-weight: 700; }
        .challenge-item .ch-time { font-size: var(--font-sm); color: var(--warning); }
        .challenge-item .ch-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .done-badge {
            display: inline-block; padding: 8px 18px; border-radius: 24px;
            font-size: var(--font-sm); font-weight: 700; cursor: pointer; border: 2px solid #333;
            min-width: 110px; text-align: center; transition: all 0.2s;
        }
        .done-badge.completed { background: var(--success); border-color: var(--success); color: white; }
        .done-badge.pending { background: transparent; border-color: var(--challenge); color: var(--challenge); }
        .prize-fund {
            background: linear-gradient(135deg, #1a3a2a, #0a1a0a);
            border: 3px solid var(--tournament); border-radius: var(--radius);
            padding: 22px; margin: 20px 0; text-align: center;
        }
        .prize-fund h3 { font-size: var(--font-md); color: var(--dim); margin-bottom: 6px; }
        .prize-fund .amount { font-size: var(--font-huge); font-weight: 800; color: var(--gold); }
        .sale-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 18px;
            margin-bottom: 14px; border: 1px solid #222;
        }
        .sale-item h3 { font-size: var(--font-md); color: var(--gold-light); margin-bottom: 6px; }
        .sale-item .oracle { font-size: var(--font-xs); color: var(--dim); margin: 8px 0; padding: 10px; background: #0a0a0a; border-radius: 10px; font-style: italic; line-height: 1.5; }
        .sale-item .price { font-size: 24px; font-weight: 800; color: white; }
        .sale-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .task-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 16px;
            margin-bottom: 10px; border: 1px solid #222;
        }
        .task-item h3 { font-size: var(--font-md); color: var(--text); margin-bottom: 6px; }
        .task-item .task-meta { font-size: var(--font-xs); color: var(--dim); margin-bottom: 8px; }
        .task-item .task-link { font-size: 11px; color: var(--info); word-break: break-all; }
        .task-done { opacity: 0.5; }
        .task-done h3 { text-decoration: line-through; }
        .btn {
            background: var(--card-bg); border: 1px solid #333; color: white;
            padding: var(--btn-padding); border-radius: 14px; font-size: var(--font-md); font-weight: 700;
            width: 100%; margin-top: 10px; cursor: pointer; text-align: center; display: block;
            letter-spacing: 0.5px;
        }
        .btn-primary { background: var(--accent); border: none; }
        .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn-info { background: var(--info); border: none; color: white; }
        .btn-gold { background: transparent; border-color: var(--gold); color: var(--gold); }
        .btn-accent { background: transparent; border-color: var(--accent); color: var(--accent); }
        .btn-warning { background: var(--warning); border: none; color: white; }
        .btn-tournament { background: var(--tournament); border: none; color: white; }
        .btn-challenge { background: var(--challenge); border: none; color: white; }
        .btn-sell-btn { background: var(--success); color: white; border: none; }
        .btn-price-btn { background: var(--accent); color: white; border: none; }
        .btn-small { padding: 10px 16px; font-size: var(--font-xs); width: auto; display: inline-block; margin: 4px; }
        .btn-export { background: #1a5c2a; border: 1px solid var(--success); color: var(--success); }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 999; align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: var(--card-bg); width: 92%; max-width: 480px; padding: 28px;
            border-radius: 22px; border: 1px solid #333; max-height: 80vh; overflow-y: auto;
        }
        .modal-box h2 { color: var(--gold); margin-bottom: 20px; font-size: 24px; }
        input, select, textarea {
            width: 100%; padding: var(--input-padding); margin: 10px 0; background: #000;
            border: 1px solid #333; color: white; border-radius: 12px; font-size: var(--font-md); outline: none;
        }
        textarea { resize: vertical; min-height: 90px; font-family: monospace; font-size: var(--font-sm); }
        .row { display: flex; gap: 10px; margin-top: 20px; }
        .row .btn { flex: 1; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; margin: 14px 0; }
        .switch { position: relative; display: inline-block; width: 56px; height: 30px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; border-radius: 30px; cursor: pointer; }
        .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: 0.2s; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(26px); }
        .back-link { color: var(--gold); margin-bottom: 16px; display: block; cursor: pointer; font-weight: 700; font-size: var(--font-md); }
        .history-item { padding: 12px 0; border-bottom: 1px solid #222; font-size: var(--font-sm); }
        .history-item small { color: #555; }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-accent { color: var(--accent); }
        .empty { text-align: center; margin-top: 50px; color: var(--dim); font-size: var(--font-md); }
        .stats { font-size: var(--font-sm); color: var(--dim); margin-bottom: 16px; }
        .breadcrumb { font-size: var(--font-sm); color: var(--dim); margin-bottom: 16px; }
        .breadcrumb span { color: var(--gold); cursor: pointer; font-weight: 700; }
        .backup-info { font-size: 11px; color: #444; text-align: center; margin-top: 10px; padding-bottom: 20px; }
        .backup-info span { color: var(--gold); cursor: pointer; }
        .backup-info .restore-link { color: var(--info); cursor: pointer; margin-left: 10px; }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--success); color: white; padding: 14px 28px;
            border-radius: 24px; font-weight: 700; z-index: 9999; font-size: var(--font-md);
            animation: fadeInOut 3s ease;
        }
        .toast.error { background: var(--danger); }
        @keyframes fadeInOut {
            0% { opacity: 0; bottom: 0; } 15% { opacity: 1; bottom: 30px; }
            85% { opacity: 1; bottom: 30px; } 100% { opacity: 0; bottom: 0; }
        }
        .download-link-box {
            background: #1a1a1a; border: 1px solid #333; border-radius: 14px;
            padding: 20px; margin: 14px 0; text-align: center;
        }
        .download-link-box a { color: var(--info); word-break: break-all; font-size: var(--font-sm); }
        .download-link-box button { margin-top: 10px; }
    </style>
</head>
<body>

<div class="header"><h1>🎪 The Clown's Council</h1></div>

<div class="tabs">
    <button id="tabPlayers" class="active" onclick="switchTab('players')">🧙</button>
    <button id="tabSale" onclick="switchTab('sale')">💵</button>
    <button id="tabOrders" onclick="switchTab('orders')">📦</button>
    <button id="tabTasks" onclick="switchTab('tasks')">📋</button>
    <button id="tabTournaments" onclick="switchTab('tournaments')">🏆</button>
    <button id="tabChallenges" onclick="switchTab('challenges')">🔥</button>
</div>

<input type="text" class="search-box" id="searchBox" placeholder="🔍 Поиск..." style="display:none;" oninput="render()">
<div id="app"></div>
<input type="file" id="restoreFileInput" accept=".xlsx,.csv" style="display:none;" onchange="handleRestoreFile(event)">
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modalContent"></div></div>

<script>
function ensureXLSX(cb) { if (typeof XLSX !== 'undefined') { cb(); return; } var s = document.createElement('script'); s.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js'; s.onload = cb; document.head.appendChild(s); }
var STORE = 'clown_council_s25';
function getData() { var r = localStorage.getItem(STORE); if (!r) return { players: {}, orders: [], saleCards: [], taskFolders: [], tournaments: [], challengeFolders: [], lastBackup: null }; try { return JSON.parse(r); } catch(e) { return { players: {}, orders: [], saleCards: [], taskFolders: [], tournaments: [], challengeFolders: [], lastBackup: null }; } }
function saveData(d) { try { localStorage.setItem(STORE, JSON.stringify(d)); } catch(e) { alert('Память переполнена!'); } }
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

function saveXLSXToDevice(filename, wb) {
    var wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    var blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var file = new File([blob], filename, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Сохранить ' + filename }).then(function() {
            showToast('✅ Файл сохранён!', false);
        }).catch(function() { openBlobInNewTab(blob, filename); });
    } else { openBlobInNewTab(blob, filename); }
}
function openBlobInNewTab(blob, filename) {
    var url = URL.createObjectURL(blob);
    var w = window.open(url, '_blank');
    if (!w) { showDownloadLink(url, filename); }
    else { showToast('📥 Файл открыт. Нажми «Сохранить».', false); setTimeout(function() { URL.revokeObjectURL(url); }, 5000); }
}
function showDownloadLink(url, filename) {
    var h = '<h2>📥 Скачать файл</h2><p style="color:var(--dim);font-size:14px;">Файл готов:</p>';
    h += '<div class="download-link-box"><a href="' + url + '" download="' + filename + '" target="_blank">📄 ' + filename + '</a>';
    h += '<br><button class="btn btn-info" onclick="var a=document.createElement(\'a\');a.href=\'' + url + '\';a.download=\'' + filename + '\';a.click();">📥 Скачать</button></div>';
    h += '<button class="btn" onclick="closeModal()">Закрыть</button>';
    openModal(h);
}
function showToast(msg, isError) {
    var t = document.createElement('div'); t.className = 'toast' + (isError ? ' error' : ''); t.textContent = msg;
    document.body.appendChild(t); setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 3200);
}

function downloadBackupXLSX(filename, d, silent) {
    ensureXLSX(function() {
        var sheets = [];
        var pdata = [['Имя', 'Баланс']]; var pn = Object.keys(d.players).sort(); for (var i = 0; i < pn.length; i++) pdata.push([pn[i], d.players[pn[i]].balance || 0]); sheets.push({name: 'Игроки', data: pdata});
        var sdata = [['Название', 'Сет', 'Номер', 'Состояние', 'Фойл', 'Цена', 'Oracle']]; for (var i = 0; i < d.saleCards.length; i++) { var c = d.saleCards[i]; sdata.push([c.name||'', c.set||'', c.collector||'', c.condition||'', c.foil?'Да':'Нет', c.price||'', c.oracle||'']); } sheets.push({name: 'На продажу', data: sdata});
        var odata = [['Игрок', 'Карта', 'Сумма', 'Статус', 'Дата']]; for (var i = 0; i < d.orders.length; i++) { var o = d.orders[i]; odata.push([o.playerName||'', o.card||'', o.amount||0, o.status||'', o.date||'']); } sheets.push({name: 'Заказы', data: odata});
        var tdata = [['Папка', 'Задача', 'Описание', 'Цена', 'Ссылка', 'Выполнено']]; for (var i = 0; i < d.taskFolders.length; i++) { var f = d.taskFolders[i]; for (var j = 0; j < f.tasks.length; j++) { var t = f.tasks[j]; tdata.push([f.name||'', t.title||'', t.desc||'', t.price||'', t.link||'', t.done?'Да':'Нет']); } } sheets.push({name: 'Задачи', data: tdata});
        for (var i = 0; i < d.tournaments.length; i++) { var trn = d.tournaments[i]; var trdata = [['Игрок', 'Ссылка на колоду', 'Командир', 'Партнёр', 'Компаньон', 'Взнос', 'Оплата']]; for (var j = 0; j < trn.participants.length; j++) { var p = trn.participants[j]; trdata.push([p.name||'', p.deckLink||'', p.commander||'', p.partner||'', p.companion||'', (p.entryFee||'500')+' ₽', p.paid?'Оплатил':'Не оплатил']); } sheets.push({name: 'Турнир - '+(trn.name||'Без имени'), data: trdata}); }
        for (var i = 0; i < d.challengeFolders.length; i++) { var cf = d.challengeFolders[i]; var chdata = [['Название', 'Условия', 'Время', 'Игрок', 'Выполнен']]; for (var j = 0; j < cf.challenges.length; j++) { var ch = cf.challenges[j]; chdata.push([ch.title||'', ch.conditions||'', ch.time||'', ch.player||'', ch.done?'Да':'Нет']); } sheets.push({name: 'Челенджи - '+(cf.name||'Без имени'), data: chdata}); }
        var wb = XLSX.utils.book_new(); for (var i = 0; i < sheets.length; i++) { var ws = XLSX.utils.aoa_to_sheet(sheets[i].data); XLSX.utils.book_append_sheet(wb, ws, sheets[i].name || ('Sheet'+(i+1))); }
        if (silent) {
            var wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' }); var blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            var url = URL.createObjectURL(blob); var a = document.createElement('a'); a.href = url; a.download = filename; a.style.display = 'none';
            document.body.appendChild(a); a.click(); setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 5000);
        } else { saveXLSXToDevice(filename, wb); }
    });
}
function checkAutoBackup() { var d = getData(); var now = new Date(); var last = d.lastBackup ? new Date(d.lastBackup) : null; if (!last || (now - last) >= 7*24*60*60*1000) { downloadBackupXLSX('clown_council_backup_' + new Date().toISOString().slice(0,10) + '.xlsx', d, true); d.lastBackup = now.toISOString(); saveData(d); } }
function triggerRestore() { document.getElementById('restoreFileInput').click(); }
function handleRestoreFile(e) { var f = e.target.files[0]; if (!f) return; var r = new FileReader(); r.onload = function(ev) { ensureXLSX(function() { var wb = XLSX.read(ev.target.result, {type:'array'}); var res = parseBackupXLSX(wb); if (res) { saveData(res); alert('✅ Восстановлено!'); currentTab='players'; currentPlayer=null; currentFolder=null; currentTournament=null; currentChallengeFolder=null; render(); } else alert('❌ Ошибка формата.'); }); }; r.readAsArrayBuffer(f); e.target.value = ''; }
function parseBackupXLSX(wb) { try { var d = { players:{}, orders:[], saleCards:[], taskFolders:[], tournaments:[], challengeFolders:[], lastBackup: new Date().toISOString() }; var sn = wb.SheetNames; for (var s = 0; s < sn.length; s++) { var name = sn[s]; var ws = wb.Sheets[name]; var data = XLSX.utils.sheet_to_json(ws, {header:1}); if (!data || data.length < 2) continue; if (name === 'Игроки') { for (var i = 1; i < data.length; i++) { var r = data[i]; if (r[0]) d.players[r[0].toString().trim()] = {balance: parseInt(r[1])||0, history:[]}; } } else if (name === 'На продажу') { for (var i = 1; i < data.length; i++) { var r = data[i]; d.saleCards.push({id:genId(), name:r[0]||'', set:r[1]||'', collector:r[2]||'', condition:r[3]||'', foil:r[4]==='Да', price:r[5]||'', oracle:r[6]||''}); } } else if (name === 'Заказы') { for (var i = 1; i < data.length; i++) { var r = data[i]; d.orders.push({id:genId(), playerName:r[0]||'', card:r[1]||'', amount:parseInt(r[2])||0, status:r[3]||'', date:r[4]||''}); } } else if (name === 'Задачи') { for (var i = 1; i < data.length; i++) { var r = data[i]; var fn = (r[0]||'').toString().trim(); if (!fn) continue; var fo = null; for (var j = 0; j < d.taskFolders.length; j++) { if (d.taskFolders[j].name === fn) { fo = d.taskFolders[j]; break; } } if (!fo) { fo = {id:genId(), name:fn, tasks:[]}; d.taskFolders.push(fo); } fo.tasks.push({id:genId(), title:r[1]||'', desc:r[2]||'', price:r[3]||'', link:r[4]||'', done:r[5]==='Да', date:''}); } } else if (name.indexOf('Турнир - ') === 0) { var trnName = name.replace('Турнир - ', ''); var trn = {id:genId(), name:trnName, participants:[]}; for (var i = 1; i < data.length; i++) { var r = data[i]; trn.participants.push({id:genId(), name:r[0]||'', deckLink:r[1]||'', commander:r[2]||'', partner:r[3]||'', companion:r[4]||'', entryFee:(r[5]||'500').toString().replace(' ₽',''), paid:r[6]==='Оплатил'}); } d.tournaments.push(trn); } else if (name.indexOf('Челенджи - ') === 0) { var cfName = name.replace('Челенджи - ', ''); var cf = {id:genId(), name:cfName, challenges:[]}; for (var i = 1; i < data.length; i++) { var r = data[i]; cf.challenges.push({id:genId(), title:r[0]||'', conditions:r[1]||'', time:r[2]||'', player:r[3]||'', done:r[4]==='Да'}); } d.challengeFolders.push(cf); } } return d; } catch(e) { return null; } }

var currentTab='players',currentPlayer=null,currentFolder=null,currentTournament=null,currentChallengeFolder=null;
function switchTab(t) { currentTab=t; currentPlayer=null; currentFolder=null; currentTournament=null; currentChallengeFolder=null; var tabs=['players','sale','orders','tasks','tournaments','challenges']; for(var i=0;i<tabs.length;i++) document.getElementById('tab'+tabs[i].charAt(0).toUpperCase()+tabs[i].slice(1)).className=(t===tabs[i])?'active':''; document.getElementById('searchBox').style.display=(t==='sale'||t==='tasks')?'block':'none'; if(t!=='sale'&&t!=='tasks')document.getElementById('searchBox').value=''; render(); }
function closeModal(){document.getElementById('modal').classList.remove('active');}
function openModal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('modal').classList.add('active');}
function goBack(){currentPlayer=null;render();}
function goBackFolder(){currentFolder=null;render();}
function goBackTournament(){currentTournament=null;render();}
function goBackChallengeFolder(){currentChallengeFolder=null;render();}

function render() {
    var d=getData(),app=document.getElementById('app'),html='';
    if(currentTab==='players')html=renderPlayers(d);
    else if(currentTab==='sale')html=renderSale(d);
    else if(currentTab==='orders')html=renderOrders(d);
    else if(currentTab==='tasks')html=renderTasks(d);
    else if(currentTab==='tournaments')html=renderTournaments(d);
    else if(currentTab==='challenges')html=renderChallenges(d);
    var lb=d.lastBackup?new Date(d.lastBackup).toLocaleString('ru-RU'):'ещё не было';
    html+='<div class="backup-info">💾 Бэкап (.xlsx): '+lb+' | <span onclick="manualBackup()">Сохранить</span> | <span class="restore-link" onclick="triggerRestore()">📥 Загрузить бэкап</span></div>';
    app.innerHTML=html;
}
function manualBackup(){var d=getData();downloadBackupXLSX('clown_council_backup_' + new Date().toISOString().slice(0,10) + '.xlsx', d);d.lastBackup=new Date().toISOString();saveData(d);render();}

// ── PLAYERS ──
function renderPlayers(d) {
    var h='';
    if(currentPlayer&&d.players[currentPlayer]){var p=d.players[currentPlayer];h+='<div class="back-link" onclick="goBack()">← Назад</div><div class="list-item"><div><h3>'+currentPlayer+'</h3></div><span>'+(p.balance||0)+' ₽</span></div><button class="btn" onclick="showAddFunds()">💰 Пополнить</button><button class="btn btn-gold" onclick="showSpend()">🛒 Покупка из альбома</button><button class="btn btn-accent" onclick="showOrder()">📦 Заказ под привоз</button><button class="btn btn-danger" onclick="deletePlayer()">🗑 Удалить</button><h3 style="margin-top:24px;color:var(--dim);">📋 История</h3>';if(!p.history||!p.history.length)h+='<div class="empty">Нет операций</div>';else{var hist=p.history.slice().reverse();for(var i=0;i<hist.length;i++){var hi=hist[i],s='+',c='text-success';if(hi.type==='spend'){s='−';c='text-danger';}if(hi.type==='order'){s='🔒';c='text-accent';}h+='<div class="history-item"><span class="'+c+'"><b>'+s+(hi.amount||0)+' ₽</b></span> — '+(hi.card||'')+'<br><small>'+(hi.date||'')+'</small></div>';}}}
    else{currentPlayer=null;h+='<button class="btn btn-primary" onclick="showAddPlayer()">+ Добавить игрока</button>';var n=Object.keys(d.players).sort();if(!n.length)h+='<div class="empty">Пока никого нет</div>';else for(var i=0;i<n.length;i++)h+='<div class="list-item" onclick="openPlayer(\''+n[i]+'\')"><div><h3>'+n[i]+'</h3></div><span>'+(d.players[n[i]].balance||0)+' ₽</span></div>';}
    return h;
}
function openPlayer(n){currentPlayer=n;render();}
function showAddPlayer(){openModal('<h2>✨ Новый игрок</h2><input id="pName" placeholder="Имя"><input id="pBal" type="number" value="0"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="addPlayer()">Создать</button></div>');}
function addPlayer(){var n=document.getElementById('pName').value.trim();if(!n)return alert('Введи!');var b=parseInt(document.getElementById('pBal').value)||0;var d=getData();if(d.players[n])return alert('Есть!');d.players[n]={balance:b,history:b>0?[{date:new Date().toLocaleString('ru-RU'),amount:b,type:'add',card:'Старт'}]:[]};saveData(d);closeModal();render();}
function showAddFunds(){openModal('<h2>💰 '+currentPlayer+'</h2><input id="amount" type="number" value="500"><input id="note" placeholder="Примечание"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="addFunds()">Зачислить</button></div>');}
function addFunds(){var a=parseInt(document.getElementById('amount').value)||0;if(a<=0)return;var d=getData();d.players[currentPlayer].balance+=a;d.players[currentPlayer].history.push({date:new Date().toLocaleString('ru-RU'),amount:a,type:'add',card:document.getElementById('note').value.trim()||'Пополнение'});saveData(d);closeModal();render();}
function showSpend(){openModal('<h2>🛒 '+currentPlayer+'</h2><input id="spendCard" placeholder="Карта"><input id="spendAmount" type="number"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-gold" style="background:var(--gold);color:#000;" onclick="spendFunds()">Списать</button></div>');}
function spendFunds(){var a=parseInt(document.getElementById('spendAmount').value)||0;if(a<=0)return;var d=getData();if(d.players[currentPlayer].balance<a)return alert('Недостаточно!');d.players[currentPlayer].balance-=a;d.players[currentPlayer].history.push({date:new Date().toLocaleString('ru-RU'),amount:a,type:'spend',card:document.getElementById('spendCard').value.trim()||'Карта'});saveData(d);closeModal();render();}
function showOrder(){openModal('<h2>📦 '+currentPlayer+'</h2><input id="orderCard" placeholder="Карта"><input id="orderBase" type="number" placeholder="Цена" oninput="updateOrderTotal()"><div class="toggle-row"><span>+20%</span><label class="switch"><input type="checkbox" id="orderComm" checked onchange="updateOrderTotal()"><span class="slider"></span></label></div><p style="text-align:right;">Итог: <b id="orderTotal">0 ₽</b></p><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-accent" style="background:var(--accent);" onclick="placeOrderFromPlayer()">Заказать</button></div>');}
function updateOrderTotal(){document.getElementById('orderTotal').innerText=((document.getElementById('orderComm').checked?Math.round((parseInt(document.getElementById('orderBase').value)||0)*1.2):(parseInt(document.getElementById('orderBase').value)||0)))+' ₽';}
function placeOrderFromPlayer(){var c=document.getElementById('orderCard').value.trim(),b=parseInt(document.getElementById('orderBase').value)||0,cm=document.getElementById('orderComm').checked,t=cm?Math.round(b*1.2):b;if(!c||t<=0)return alert('Заполни!');var d=getData();if(d.players[currentPlayer].balance<t)return alert('Недостаточно!');d.players[currentPlayer].balance-=t;d.players[currentPlayer].history.push({date:new Date().toLocaleString('ru-RU'),amount:t,type:'order',card:c+' (ЗАКАЗ)'});d.orders.push({id:genId(),playerName:currentPlayer,card:c,amount:t,status:'pending',date:new Date().toLocaleString('ru-RU')});saveData(d);closeModal();render();}
function deletePlayer(){if(!confirm('Удалить?'))return;var d=getData();delete d.players[currentPlayer];currentPlayer=null;saveData(d);render();}

var autocompleteTimer=null;
function showAddSaleCard(){openModal('<h2>💵 Карта</h2><div class="autocomplete-wrap"><input id="saleName" placeholder="Название" autocomplete="off" oninput="onNameInput()" onkeydown="onNameKeydown(event)"><div class="autocomplete-list" id="autocompleteList"></div></div><p id="oraclePreview"></p><input id="saleSet" placeholder="Сет"><input id="saleCollector" placeholder="Номер"><select id="saleCondition"><option>Near Mint</option><option>Lightly Played</option><option>Moderately Played</option></select><div class="toggle-row"><span>Фойл</span><label class="switch"><input type="checkbox" id="saleFoil"><span class="slider"></span></label></div><input id="salePrice" type="number" placeholder="Цена"><input type="hidden" id="saleOracle"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-sell-btn" onclick="addSaleCard()">Добавить</button></div>');}
function onNameInput(){var v=document.getElementById('saleName').value.trim(),l=document.getElementById('autocompleteList');if(autocompleteTimer)clearTimeout(autocompleteTimer);if(v.length<2){l.style.display='none';return;}autocompleteTimer=setTimeout(function(){fetch('https://api.scryfall.com/cards/autocomplete?q='+encodeURIComponent(v)).then(function(r){return r.json();}).then(function(j){l.innerHTML='';if(j.data&&j.data.length>0){for(var i=0;i<Math.min(j.data.length,8);i++){var d=document.createElement('div');d.textContent=j.data[i];d.onclick=function(){document.getElementById('saleName').value=this.textContent;l.style.display='none';fetchOracle(this.textContent);};l.appendChild(d);}l.style.display='block';}else l.style.display='none';}).catch(function(){l.style.display='none';});},300);}
function onNameKeydown(e){if(e.key==='Enter'){e.preventDefault();var f=document.getElementById('autocompleteList').querySelector('div');if(f)f.click();else fetchOracle(document.getElementById('saleName').value.trim());}}
function fetchOracle(n){var o=document.getElementById('oraclePreview');if(!n)return;o.textContent='...';fetch('https://api.scryfall.com/cards/named?exact='+encodeURIComponent(n)).then(function(r){return r.json();}).then(function(j){if(j.oracle_text){o.textContent='📜 '+j.oracle_text;document.getElementById('saleOracle').value=j.oracle_text;}else o.textContent='-';}).catch(function(){o.textContent='-';});}
function addSaleCard(){var n=document.getElementById('saleName').value.trim();if(!n)return alert('Введи!');var d=getData();d.saleCards.push({id:genId(),name:n,set:document.getElementById('saleSet').value.trim(),collector:document.getElementById('saleCollector').value.trim(),condition:document.getElementById('saleCondition').value,foil:document.getElementById('saleFoil').checked,price:document.getElementById('salePrice').value.trim(),oracle:document.getElementById('saleOracle').value.trim()});saveData(d);closeModal();render();}
function editSaleCard(id){var d=getData(),c=null;for(var i=0;i<d.saleCards.length;i++){if(d.saleCards[i].id===id){c=d.saleCards[i];break;}}if(!c)return;openModal('<h2>✏️</h2><input id="saleName" value="'+(c.name||'')+'"><input id="saleSet" value="'+(c.set||'')+'"><input id="saleCollector" value="'+(c.collector||'')+'"><select id="saleCondition"><option'+(c.condition==='Near Mint'?' selected':'')+'>Near Mint</option><option'+(c.condition==='Lightly Played'?' selected':'')+'>Lightly Played</option><option'+(c.condition==='Moderately Played'?' selected':'')+'>Moderately Played</option></select><div class="toggle-row"><span>Фойл</span><label class="switch"><input type="checkbox" id="saleFoil"'+(c.foil?' checked':'')+'><span class="slider"></span></label></div><input id="salePrice" type="number" value="'+(c.price||'')+'"><textarea id="saleOracle">'+(c.oracle||'')+'</textarea><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-sell-btn" onclick="saveSaleCard(\''+id+'\')">Сохранить</button></div>');}
function saveSaleCard(id){var d=getData();for(var i=0;i<d.saleCards.length;i++){if(d.saleCards[i].id===id){d.saleCards[i].name=document.getElementById('saleName').value.trim();d.saleCards[i].set=document.getElementById('saleSet').value.trim();d.saleCards[i].collector=document.getElementById('saleCollector').value.trim();d.saleCards[i].condition=document.getElementById('saleCondition').value;d.saleCards[i].foil=document.getElementById('saleFoil').checked;d.saleCards[i].price=document.getElementById('salePrice').value.trim();d.saleCards[i].oracle=document.getElementById('saleOracle').value.trim();break;}}saveData(d);closeModal();render();}
function setSalePrice(id){var d=getData(),c=null;for(var i=0;i<d.saleCards.length;i++){if(d.saleCards[i].id===id){c=d.saleCards[i];break;}}if(!c)return;openModal('<h2>💰</h2><p>'+c.name+'</p><input id="newPrice" type="number" value="'+(c.price||'')+'"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-price-btn" onclick="saveSalePrice(\''+id+'\')">Сохранить</button></div>');}
function saveSalePrice(id){var d=getData();for(var i=0;i<d.saleCards.length;i++){if(d.saleCards[i].id===id){d.saleCards[i].price=document.getElementById('newPrice').value.trim();break;}}saveData(d);closeModal();render();}
function sellToPlayer(id){var d=getData(),c=null;for(var i=0;i<d.saleCards.length;i++){if(d.saleCards[i].id===id){c=d.saleCards[i];break;}}if(!c||!c.price)return alert('Установи цену!');var n=Object.keys(d.players).sort();if(!n.length)return alert('Нет игроков!');var h='<h2>💵</h2><p>'+c.name+'</p><p style="font-size:22px;"><b>'+c.price+' ₽</b></p><select id="sellPlayer">';for(var i=0;i<n.length;i++)h+='<option>'+n[i]+' ('+(d.players[n[i]].balance||0)+' ₽)</option>';h+='</select><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-sell-btn" onclick="confirmSellToPlayer(\''+id+'\')">Продать</button></div>';openModal(h);}
function confirmSellToPlayer(id){var pl=document.getElementById('sellPlayer').value.split(' (')[0],d=getData(),c=null;for(var i=0;i<d.saleCards.length;i++){if(d.saleCards[i].id===id){c=d.saleCards[i];break;}}if(!c)return;var pr=parseInt(c.price)||0;if(d.players[pl].balance<pr)return alert('Недостаточно!');d.players[pl].balance-=pr;d.players[pl].history.push({date:new Date().toLocaleString('ru-RU'),amount:pr,type:'spend',card:c.name});d.saleCards=d.saleCards.filter(function(x){return x.id!==id;});saveData(d);closeModal();alert('Продано!');render();}
function deleteSaleCard(id){if(!confirm('Удалить?'))return;var d=getData();d.saleCards=d.saleCards.filter(function(c){return c.id!==id;});saveData(d);render();}
function clearSale(){if(!confirm('Очистить?'))return;var d=getData();d.saleCards=[];saveData(d);render();}
function renderSale(d){var h='',s=(document.getElementById('searchBox').value||'').toLowerCase(),cards=d.saleCards||[],f=[];for(var i=0;i<cards.length;i++){if(s===''||(cards[i].name||'').toLowerCase().indexOf(s)!==-1||(cards[i].oracle||'').toLowerCase().indexOf(s)!==-1)f.push(cards[i]);}h+='<div class="stats">💵 Карт: <b>'+cards.length+'</b> | <b>'+f.length+'</b></div><button class="btn btn-sell-btn" onclick="showAddSaleCard()">+ Добавить</button>';if(cards.length)h+='<button class="btn btn-danger" style="margin-top:10px;" onclick="clearSale()">🗑 Очистить</button>';if(!f.length)h+='<div class="empty">'+(cards.length?'Ничего не найдено.':'Пусто.')+'</div>';else for(var i=0;i<f.length;i++){var c=f[i];h+='<div class="sale-item"><h3>🃏 '+(c.name||'???')+'</h3>';if(c.set||c.collector){h+='<div class="meta">';if(c.set)h+='<span>📗 '+c.set.toUpperCase()+'</span>';if(c.collector)h+='<span>#'+c.collector+'</span>';if(c.foil)h+='<span style="color:var(--gold);">✨ FOIL</span>';h+='</div>';}if(c.oracle)h+='<div class="oracle">'+c.oracle+'</div>';h+='<div class="price">'+(c.price?c.price+' ₽':'<span class="no-price">Цена не задана</span>')+'</div><div class="sale-actions"><button class="btn btn-small btn-sell-btn" onclick="sellToPlayer(\''+c.id+'\')">💵</button><button class="btn btn-small btn-price-btn" onclick="setSalePrice(\''+c.id+'\')">💰</button><button class="btn btn-small" style="background:var(--info);" onclick="editSaleCard(\''+c.id+'\')">✏️</button><button class="btn btn-small" style="background:var(--danger);" onclick="deleteSaleCard(\''+c.id+'\')">🗑</button></div></div>';}return h;}

function showAddOrder(){var d=getData(),n=Object.keys(d.players).sort(),h='<h2>📦</h2><select id="orderPlayerGlobal">';for(var i=0;i<n.length;i++)h+='<option>'+n[i]+'</option>';h+='</select><input id="orderCardGlobal" placeholder="Карта"><input id="orderBaseGlobal" type="number" placeholder="Цена" oninput="updateOrderTotalGlobal()"><div class="toggle-row"><span>+20%</span><label class="switch"><input type="checkbox" id="orderCommGlobal" checked onchange="updateOrderTotalGlobal()"><span class="slider"></span></label></div><p style="text-align:right;">Итог: <b id="orderTotalGlobal">0 ₽</b></p><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="placeOrderGlobal()">Заказать</button></div>';openModal(h);}

function placeOrderGlobal(){var pl=document.getElementById('orderPlayerGlobal').value,c=document.getElementById('orderCardGlobal').value.trim(),b=parseInt(document.getElementById('orderBaseGlobal').value)||0,cm=document.getElementById('orderCommGlobal').checked,t=cm?Math.round(b*1.2):b;if(!c||t<=0)return alert('Заполни!');var d=getData();if(d.players[pl].balance<t)return alert('Недостаточно!');d.players[pl].balance-=t;d.players[pl].history.push({date:new Date().toLocaleString('ru-RU'),amount:t,type:'order',card:c+' (ЗАКАЗ)'});d.orders.push({id:genId(),playerName:pl,card:c,amount:t,status:'pending',date:new Date().toLocaleString('ru-RU')});saveData(d);closeModal();render();}

ing" onclick="showAddFolder()">📁 Новая папка</button>';if(!folds.length)h+='<div class="empty">Нет папок.</div>';else for(var i=0;i<folds.length;i++){var f=folds[i];h+='<div class="folder-item" onclick="openFolder(\''+f.id+'\')"><div><h3>📂 '+(f.name||'Без имени')+'</h3><div class="folder-stats">'+(f.tasks||[]).length+' задач</div></div><span>→</span></div>';}return h;}

function renderTournaments(d) {
    var h='',trns=d.tournaments||[];
    if(currentTournament){
        var trn=null;for(var i=0;i<trns.length;i++){if(trns[i].id===currentTournament){trn=trns[i];break;}}
        if(!trn){currentTournament=null;return renderTournaments(d);}
        var parts=trn.participants||[],pc=parts.filter(function(p){return p.paid;}).length,pf=0;
        for(var i=0;i<parts.length;i++){if(parts[i].paid)pf+=(parseInt(parts[i].entryFee)||500);}
        h+='<div class="breadcrumb"><span onclick="goBackTournament()">🏆 Все папки</span> → 🏟 '+trn.name+'</div>';
        h+='<div class="prize-fund"><h3>🏆 ПРИЗОВОЙ ФОНД</h3><div class="amount">'+pf.toLocaleString()+' ₽</div><div style="font-size:14px;color:var(--dim);">Оплатили: '+pc+' из '+parts.length+'</div></div>';
        h+='<div class="stats">👥 Игроков: <b>'+parts.length+'</b> | 💰 Оплатили: <b>'+pc+'</b></div>';
        h+='<div style="display:flex;gap:10px;margin-bottom:14px;"><button class="btn btn-tournament" style="flex:1;" onclick="showAddParticipant()">+ Игрок</button><button class="btn btn-export" style="flex:1;" onclick="exportTournament(\''+trn.id+'\')">📥 Excel</button></div>';
        if(!parts.length)h+='<div class="empty">Нет игроков.</div>';
        else for(var i=0;i<parts.length;i++){
            var p=parts[i];
            h+='<div class="participant-row"><div class="info"><h4>👤 '+(p.name||'???')+'</h4><div class="deck">🔗 '+(p.deckLink?'<a href="'+p.deckLink+'" target="_blank">'+p.deckLink+'</a>':'<span style="color:var(--dim);">—</span>')+'</div>';
            if(p.commander||p.partner||p.companion){h+='<div class="commanders">';if(p.commander)h+='🎖 '+p.commander+' ';if(p.partner)h+='🤝 '+p.partner+' ';if(p.companion)h+='🐾 '+p.companion;h+='</div>';}
            h+='</div><div class="actions"><button class="btn btn-small" style="background:var(--info);color:white;" onclick="editParticipant(\''+p.id+'\')">✏️</button><div class="paid-badge '+(p.paid?'paid':'unpaid')+'" onclick="togglePaid(\''+p.id+'\')">'+(p.paid?'✅ Оплатил':'❌ Не оплатил')+'</div><button class="btn btn-small" style="background:var(--danger);" onclick="deleteParticipant(\''+p.id+'\')">🗑</button></div></div>';
        }
        h+='<div style="margin-top:20px;border-top:1px solid #333;padding-top:14px;"><button class="btn btn-warning" onclick="editTournament(\''+trn.id+'\')">✏️ Переименовать</button><button class="btn btn-danger" onclick="deleteTournament(\''+trn.id+'\')">🗑 Удалить</button></div>';
        return h;
    }
    h+='<button class="btn btn-tournament" onclick="showAddTournament()">🏟 Новая папка турнира</button>';
    if(!trns.length)h+='<div class="empty">Нет папок.</div>';

    return h;
}

function renderChallenges(d) {
    var h='',folds=d.challengeFolders||[];
    if(currentChallengeFolder){
        var cf=null;for(var i=0;i<folds.length;i++){if(folds[i].id===currentChallengeFolder){cf=folds[i];break;}}
        if(!cf){currentChallengeFolder=null;return renderChallenges(d);}
        var challenges=cf.challenges||[];
        var completedCount=challenges.filter(function(c){return c.done;}).length;
        h+='<div class="breadcrumb"><span onclick="goBackChallengeFolder()">🔥 Все папки</span> → 📂 '+cf.name+'</div>';
        h+='<div class="stats">🔥 Челенджей: <b>'+challenges.length+'</b> | ✅ Выполнено: <b>'+completedCount+'</b></div>';
        h+='<button class="btn btn-challenge" onclick="showAddChallenge()">+ Новый челендж</button>';
        if(!challenges.length)h+='<div class="empty">Нет челенджей.</div>';
        else{
            challenges.sort(function(a,b){return (a.done?1:0)-(b.done?1:0);});
            for(var i=0;i<challenges.length;i++){
                var ch=challenges[i];
                h+='<div class="challenge-item'+(ch.done?' done':'')+'">';
                h+='<h4>'+(ch.done?'✅ ':'🔥 ')+(ch.title||'Без названия')+'</h4>';
                if(ch.conditions)h+='<div class="ch-conditions">📋 '+ch.conditions+'</div>';
                h+='<div class="ch-meta">';
                if(ch.time)h+='<span class="ch-time">⏰ '+ch.time+'</span>';
                if(ch.player)h+='<span class="ch-player">👤 '+ch.player+'</span>';
                h+='</div>';
                h+='<div class="ch-actions">';
                h+='<button class="btn btn-small done-badge '+(ch.done?'completed':'pending')+'" onclick="toggleChallenge(\''+ch.id+'\')">'+(ch.done?'✅ Выполнен':'⬜ Выполнить')+'</button>';
                h+='<button class="btn btn-small btn-price-btn" onclick="editChallenge(\''+ch.id+'\')">✏️</button>';
                h+='<button class="btn btn-small" style="background:var(--danger);" onclick="deleteChallenge(\''+ch.id+'\')">🗑</button>';
                h+='</div></div>';
            }
        }
        h+='<div style="margin-top:20px;border-top:1px solid #333;padding-top:14px;"><button class="btn btn-warning" onclick="editChallengeFolder(\''+cf.id+'\')">✏️ Переименовать</button><button class="btn btn-danger" onclick="deleteChallengeFolder(\''+cf.id+'\')">🗑 Удалить</button></div>';
        return h;
    }
    h+='<button class="btn btn-challenge" onclick="showAddChallengeFolder()">🔥 Новая папка челенджей</button>';
    if(!folds.length)h+='<div class="empty">Нет папок.</div>';
    else for(var i=0;i<folds.length;i++){var f=folds[i];var cc=(f.challenges||[]).length;var cd=(f.challenges||[]).filter(function(c){return c.done;}).length;h+='<div class="folder-item challenge" onclick="openChallengeFolder(\''+f.id+'\')"><div><h3>🔥 '+(f.name||'Без имени')+'</h3><div class="folder-stats">'+cc+' челенджей, '+cd+' выполнено</div></div><span>→</span></div>';}
    return h;
}

function showAddChallenge(){var d=getData();var playerNames=Object.keys(d.players).sort();var h='<h2>🔥 Новый челендж</h2>';h+='<input id="chTitle" placeholder="Название челенджа">';h+='<textarea id="chConditions" placeholder="Условия выполнения"></textarea>';h+='<input id="chTime" placeholder="Время (например: до конца месяца)">';h+='<select id="chPlayer"><option value="">— Выбери игрока —</option>';for(var i=0;i<playerNames.length;i++)h+='<option value="'+playerNames[i]+'">'+playerNames[i]+'</option>';h+='</select>';h+='<div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-challenge" onclick="addChallenge()">Создать</button></div>';openModal(h);}
function addChallenge(){var title=document.getElementById('chTitle').value.trim();if(!title)return alert('Введи название!');var d=getData();for(var i=0;i<d.challengeFolders.length;i++){if(d.challengeFolders[i].id===currentChallengeFolder){d.challengeFolders[i].challenges.push({id:genId(),title:title,conditions:document.getElementById('chConditions').value.trim(),time:document.getElementById('chTime').value.trim(),player:document.getElementById('chPlayer').value,done:false});break;}}saveData(d);closeModal();render();}
function editChallenge(id){var d=getData(),ch=null;for(var i=0;i<d.challengeFolders.length;i++){if(d.challengeFolders[i].id===currentChallengeFolder){for(var j=0;j<d.challengeFolders[i].challenges.length;j++){if(d.challengeFolders[i].challenges[j].id===id){ch=d.challengeFolders[i].challenges[j];break;}}break;}}if(!ch)return;var playerNames=Object.keys(d.players).sort();var h='<h2>✏️ Редактировать</h2>';h+='<input id="chTitle" value="'+(ch.title||'')+'" placeholder="Название">';h+='<textarea id="chConditions">'+(ch.conditions||'')+'</textarea>';h+='<input id="chTime" value="'+(ch.time||'')+'" placeholder="Время">';h+='<select id="chPlayer"><option value="">— Без игрока —</option>';for(var i=0;i<playerNames.length;i++)h+='<option value="'+playerNames[i]+'"'+(ch.player===playerNames[i]?' selected':'')+'>'+playerNames[i]+'</option>';h+='</select>';h+='<div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-challenge" onclick="saveChallenge(\''+id+'\')">Сохранить</button></div>';openModal(h);}
function saveChallenge(id){var d=getData();for(var i=0;i<d.challengeFolders.length;i++){if(d.challengeFolders[i].id===currentChallengeFolder){for(var j=0;j<d.challengeFolders[i].challenges.length;j++){if(d.challengeFolders[i].challenges[j].id===id){d.challengeFolders[i].challenges[j].title=document.getElementById('chTitle').value.trim();d.challengeFolders[i].challenges[j].conditions=document.getElementById('chConditions').value.trim();d.challengeFolders[i].challenges[j].time=document.getElementById('chTime').value.trim();d.challengeFolders[i].challenges[j].player=document.getElementById('chPlayer').value;break;}}break;}}saveData(d);closeModal();render();}
function toggleChallenge(id){var d=getData();for(var i=0;i<d.challengeFolders.length;i++){if(d.challengeFolders[i].id===currentChallengeFolder){for(var j=0;j<d.challengeFolders[i].challenges.length;j++){if(d.challengeFolders[i].challenges[j].id===id){d.challengeFolders[i].challenges[j].done=!d.challengeFolders[i].challenges[j].done;break;}}break;}}saveData(d);render();}
function deleteChallenge(id){if(!confirm('Удалить?'))return;var d=getData();for(var i=0;i<d.challengeFolders.length;i++){if(d.challengeFolders[i].id===currentChallengeFolder){d.challengeFolders[i].challenges=d.challengeFolders[i].challenges.filter(function(c){return c.id!==id;});break;}}saveData(d);render();}

checkAutoBackup();render();
</script>
</body>
</html>
