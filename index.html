<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Clown's Council</title>
    <!-- SheetJS для создания .xlsx -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a; --card-bg: #141414; --gold: #c9a44b; --gold-light: #e0c878;
            --text: #e0d6c2; --dim: #7a7a7a; --accent: #7b5ea7; --danger: #8b3a3a;
            --success: #3a6b4a; --info: #3a6b8b; --warning: #8b7a3a; --tournament: #2a6b4a;
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            padding: 16px; padding-bottom: 120px; min-height: 100vh;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        .header { text-align: center; margin: 20px 0 24px; }
        .header h1 { font-size: 26px; color: var(--gold); letter-spacing: 1px; }
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
        .tabs button {
            flex: 1; min-width: 55px; padding: 12px 4px; background: var(--card-bg);
            border: 1px solid #222; color: var(--dim); font-size: 11px; font-weight: bold;
            border-radius: 12px; cursor: pointer;
        }
        .tabs button.active { background: var(--accent); color: white; border-color: var(--accent); }
        .list-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 16px;
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid #444; cursor: pointer;
        }
        .list-item h3 { font-size: 17px; }
        .list-item span { font-size: 20px; font-weight: bold; color: white; }
        .folder-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 16px;
            margin-bottom: 12px; border: 1px solid #333; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid var(--warning);
        }
        .folder-item.tournament { border-left-color: var(--tournament); }
        .folder-item h3 { font-size: 16px; }
        .folder-item .folder-stats { font-size: 13px; color: var(--dim); }
        .participant-row {
            background: var(--card-bg); border-radius: 12px; padding: 14px;
            margin-bottom: 8px; border: 1px solid #222;
        }
        .participant-row .info h4 { font-size: 15px; margin-bottom: 2px; }
        .participant-row .info .deck { font-size: 12px; color: var(--info); word-break: break-all; }
        .participant-row .info .deck a { color: var(--info); text-decoration: none; }
        .participant-row .info .commanders { font-size: 11px; color: var(--accent); margin-top: 2px; }
        .paid-badge {
            padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold;
            cursor: pointer; border: 2px solid #333; min-width: 90px; text-align: center;
            display: inline-block; margin-top: 6px;
        }
        .paid-badge.paid { background: var(--success); border-color: var(--success); color: white; }
        .paid-badge.unpaid { background: transparent; border-color: var(--danger); color: var(--danger); }
        .prize-fund {
            background: linear-gradient(135deg, #1a3a2a, #0a1a0a);
            border: 2px solid var(--tournament); border-radius: var(--radius);
            padding: 16px; margin: 16px 0; text-align: center;
        }
        .prize-fund h3 { font-size: 14px; color: var(--dim); margin-bottom: 4px; }
        .prize-fund .amount { font-size: 28px; font-weight: bold; color: var(--gold); }
        .sale-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 16px;
            margin-bottom: 12px; border: 1px solid #222;
        }
        .sale-item h3 { font-size: 17px; color: var(--gold-light); margin-bottom: 4px; }
        .sale-item .oracle { font-size: 12px; color: var(--dim); margin: 6px 0; padding: 8px; background: #0a0a0a; border-radius: 8px; font-style: italic; line-height: 1.4; }
        .sale-item .price { font-size: 20px; font-weight: bold; color: white; }
        .sale-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .sale-actions button { flex: 1; min-width: 60px; }
        .autocomplete-wrap { position: relative; }
        .autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 10;
            background: #1a1a1a; border: 1px solid #333; border-radius: 0 0 10px 10px;
            max-height: 200px; overflow-y: auto; display: none;
        }
        .autocomplete-list div { padding: 10px 14px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #222; color: #ccc; }
        .autocomplete-list div:hover { background: var(--accent); color: white; }
        .task-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 14px;
            margin-bottom: 8px; border: 1px solid #222;
        }
        .task-item h3 { font-size: 15px; color: var(--text); margin-bottom: 4px; }
        .task-item .task-meta { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
        .task-item .task-link { font-size: 11px; color: var(--info); word-break: break-all; }
        .task-done { opacity: 0.5; }
        .task-done h3 { text-decoration: line-through; }
        .btn {
            background: var(--card-bg); border: 1px solid #333; color: white;
            padding: 14px; border-radius: 12px; font-size: 15px; font-weight: bold;
            width: 100%; margin-top: 8px; cursor: pointer; text-align: center; display: block;
        }
        .btn-primary { background: var(--accent); border: none; }
        .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn-info { background: var(--info); border: none; color: white; }
        .btn-gold { background: transparent; border-color: var(--gold); color: var(--gold); }
        .btn-accent { background: transparent; border-color: var(--accent); color: var(--accent); }
        .btn-warning { background: var(--warning); border: none; color: white; }
        .btn-tournament { background: var(--tournament); border: none; color: white; }
        .btn-sell-btn { background: var(--success); color: white; border: none; }
        .btn-price-btn { background: var(--accent); color: white; border: none; }
        .btn-small { padding: 8px 12px; font-size: 12px; width: auto; display: inline-block; margin: 4px; }
        .btn-export { background: #1a5c2a; border: 1px solid var(--success); color: var(--success); }
        .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: var(--card-bg); width: 90%; max-width: 420px; padding: 24px;
            border-radius: 20px; border: 1px solid #333; max-height: 85vh; overflow-y: auto;
        }
        .modal-box h2 { color: var(--gold); margin-bottom: 16px; font-size: 20px; }
        input, select, textarea {
            width: 100%; padding: 14px; margin: 8px 0; background: #000;
            border: 1px solid #333; color: white; border-radius: 10px; font-size: 15px; outline: none;
        }
        textarea { resize: vertical; min-height: 80px; font-family: monospace; font-size: 11px; }
        .row { display: flex; gap: 8px; margin-top: 16px; }
        .row .btn { flex: 1; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; }
        .switch { position: relative; display: inline-block; width: 52px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; border-radius: 28px; cursor: pointer; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: 0.2s; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(24px); }
        .back-link { color: var(--gold); margin-bottom: 12px; display: block; cursor: pointer; font-weight: bold; }
        .history-item { padding: 10px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .history-item small { color: #555; }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-accent { color: var(--accent); }
        .empty { text-align: center; margin-top: 40px; color: var(--dim); }
        .stats { font-size: 13px; color: var(--dim); margin-bottom: 12px; }
        .breadcrumb { font-size: 13px; color: var(--dim); margin-bottom: 12px; }
        .breadcrumb span { color: var(--gold); cursor: pointer; }
        .backup-info { font-size: 11px; color: #444; text-align: center; margin-top: 8px; }
        .backup-info span { color: var(--gold); cursor: pointer; }
        .backup-info .restore-link { color: var(--info); cursor: pointer; margin-left: 8px; }
    </style>
</head>
<body>

<div class="header"><h1>🎪 The Clown's Council</h1></div>

<div class="tabs">
    <button id="tabPlayers" class="active" onclick="switchTab('players')">🧙</button>
    <button id="tabSale" onclick="switchTab('sale')">💵</button>
    <button id="tabOrders" onclick="switchTab('orders')">📦</button>
    <button id="tabTasks" onclick="switchTab('tasks')">📋</button>
    <button id="tabTournaments" onclick="switchTab('tournaments')">🏆</button>
</div>

<input type="text" class="search-box" id="searchBox" placeholder="🔍 Поиск..." style="display:none;" oninput="render()">
<div id="app"></div>
<input type="file" id="restoreFileInput" accept=".xlsx,.csv" style="display:none;" onchange="handleRestoreFile(event)">
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modalContent"></div></div>

<script>
// ── SHEETJS CHECK ──
function ensureXLSX(cb) {
    if (typeof XLSX !== 'undefined') { cb(); return; }
    var s = document.createElement('script');
    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
    s.onload = cb;
    document.head.appendChild(s);
}

var STORE = 'clown_council_v9';
function getData() { var r = localStorage.getItem(STORE); if (!r) return { players: {}, orders: [], saleCards: [], taskFolders: [], tournaments: [], lastBackup: null }; try { return JSON.parse(r); } catch(e) { return { players: {}, orders: [], saleCards: [], taskFolders: [], tournaments: [], lastBackup: null }; } }
function saveData(d) { try { localStorage.setItem(STORE, JSON.stringify(d)); } catch(e) { alert('Память переполнена!'); } }
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

// ── СКАЧИВАНИЕ XLSX ──
function downloadXLSX(filename, sheets) {
    ensureXLSX(function() {
        var wb = XLSX.utils.book_new();
        for (var i = 0; i < sheets.length; i++) {
            var ws = XLSX.utils.aoa_to_sheet(sheets[i].data);
            XLSX.utils.book_append_sheet(wb, ws, sheets[i].name || ('Sheet' + (i+1)));
        }
        XLSX.writeFile(wb, filename);
    });
}

function downloadBackupXLSX(filename, d) {
    var sheets = [];

    // Игроки
    var pdata = [['Имя', 'Баланс']];
    var pn = Object.keys(d.players).sort();
    for (var i = 0; i < pn.length; i++) pdata.push([pn[i], d.players[pn[i]].balance || 0]);
    sheets.push({name: 'Игроки', data: pdata});

    // На продажу
    var sdata = [['Название', 'Сет', 'Номер', 'Состояние', 'Фойл', 'Цена', 'Oracle']];
    for (var i = 0; i < d.saleCards.length; i++) {
        var c = d.saleCards[i];
        sdata.push([c.name||'', c.set||'', c.collector||'', c.condition||'', c.foil?'Да':'Нет', c.price||'', c.oracle||'']);
    }
    sheets.push({name: 'На продажу', data: sdata});

    // Заказы
    var odata = [['Игрок', 'Карта', 'Сумма', 'Статус', 'Дата']];
    for (var i = 0; i < d.orders.length; i++) {
        var o = d.orders[i];
        odata.push([o.playerName||'', o.card||'', o.amount||0, o.status||'', o.date||'']);
    }
    sheets.push({name: 'Заказы', data: odata});

    // Задачи
    var tdata = [['Папка', 'Задача', 'Описание', 'Цена', 'Ссылка', 'Выполнено']];
    for (var i = 0; i < d.taskFolders.length; i++) {
        var f = d.taskFolders[i];
        for (var j = 0; j < f.tasks.length; j++) {
            var t = f.tasks[j];
            tdata.push([f.name||'', t.title||'', t.desc||'', t.price||'', t.link||'', t.done?'Да':'Нет']);
        }
    }
    sheets.push({name: 'Задачи', data: tdata});

    // Турниры
    for (var i = 0; i < d.tournaments.length; i++) {
        var trn = d.tournaments[i];
        var trdata = [['Игрок', 'Ссылка на колоду', 'Командир', 'Партнёр', 'Компаньон', 'Взнос', 'Оплата']];
        for (var j = 0; j < trn.participants.length; j++) {
            var p = trn.participants[j];
            trdata.push([p.name||'', p.deckLink||'', p.commander||'', p.partner||'', p.companion||'', (p.entryFee||'500')+' ₽', p.paid?'Оплатил':'Не оплатил']);
        }
        sheets.push({name: 'Турнир - ' + (trn.name||'Без имени'), data: trdata});
    }

    downloadXLSX(filename, sheets);
}

function checkAutoBackup() {
    var d = getData(); var now = new Date(); var last = d.lastBackup ? new Date(d.lastBackup) : null;
    if (!last || (now - last) >= 7*24*60*60*1000) { downloadBackupXLSX('clown_council_backup_' + new Date().toISOString().slice(0,10) + '.xlsx', d); d.lastBackup = now.toISOString(); saveData(d); }
}

function triggerRestore() { document.getElementById('restoreFileInput').click(); }
function handleRestoreFile(e) { var f = e.target.files[0]; if (!f) return; var r = new FileReader(); r.onload = function(ev) { ensureXLSX(function() { var wb = XLSX.read(ev.target.result, {type:'array'}); var res = parseBackupXLSX(wb); if (res) { saveData(res); alert('✅ Восстановлено!'); currentTab='players'; currentPlayer=null; currentFolder=null; currentTournament=null; render(); } else alert('❌ Ошибка формата.'); }); }; r.readAsArrayBuffer(f); e.target.value = ''; }

function parseBackupXLSX(wb) {
    try {
        var d = { players:{}, orders:[], saleCards:[], taskFolders:[], tournaments:[], lastBackup: new Date().toISOString() };
        var sheetNames = wb.SheetNames;
        var currentTournament = null;

        for (var s = 0; s < sheetNames.length; s++) {
            var name = sheetNames[s];
            var ws = wb.Sheets[name];
            var data = XLSX.utils.sheet_to_json(ws, {header:1});
            if (!data || data.length < 2) continue;

            if (name === 'Игроки') {
                for (var i = 1; i < data.length; i++) {
                    var r = data[i];
                    if (r[0]) d.players[r[0].toString().trim()] = {balance: parseInt(r[1])||0, history:[]};
                }
            } else if (name === 'На продажу') {
                for (var i = 1; i < data.length; i++) {
                    var r = data[i];
                    d.saleCards.push({id:genId(), name:r[0]||'', set:r[1]||'', collector:r[2]||'', condition:r[3]||'', foil:r[4]==='Да', price:r[5]||'', oracle:r[6]||''});
                }
            } else if (name === 'Заказы') {
                for (var i = 1; i < data.length; i++) {
                    var r = data[i];
                    d.orders.push({id:genId(), playerName:r[0]||'', card:r[1]||'', amount:parseInt(r[2])||0, status:r[3]||'', date:r[4]||''});
                }
            } else if (name === 'Задачи') {
                for (var i = 1; i < data.length; i++) {
                    var r = data[i];
                    var fn = (r[0]||'').toString().trim();
                    if (!fn) continue;
                    var fo = null;
                    for (var j = 0; j < d.taskFolders.length; j++) { if (d.taskFolders[j].name === fn) { fo = d.taskFolders[j]; break; } }
                    if (!fo) { fo = {id:genId(), name:fn, tasks:[]}; d.taskFolders.push(fo); }
                    fo.tasks.push({id:genId(), title:r[1]||'', desc:r[2]||'', price:r[3]||'', link:r[4]||'', done:r[5]==='Да', date:''});
                }
            } else if (name.indexOf('Турнир - ') === 0) {
                var trnName = name.replace('Турнир - ', '');
                var trn = {id:genId(), name:trnName, participants:[]};
                for (var i = 1; i < data.length; i++) {
                    var r = data[i];
                    trn.participants.push({id:genId(), name:r[0]||'', deckLink:r[1]||'', commander:r[2]||'', partner:r[3]||'', companion:r[4]||'', entryFee:(r[5]||'500').toString().replace(' ₽',''), paid:r[6]==='Оплатил'});
                }
                d.tournaments.push(trn);
            }
        }
        return d;
    } catch(e) { return null; }
}

var currentTab='players',currentPlayer=null,currentFolder=null,currentTournament=null;
function switchTab(t) { currentTab=t; currentPlayer=null; currentFolder=null; currentTournament=null; var tabs=['players','sale','orders','tasks','tournaments']; for(var i=0;i<tabs.length;i++) document.getElementById('tab'+tabs[i].charAt(0).toUpperCase()+tabs[i].slice(1)).className=(t===tabs[i])?'active':''; document.getElementById('searchBox').style.display=(t==='sale'||t==='tasks')?'block':'none'; if(t!=='sale'&&t!=='tasks')document.getElementById('searchBox').value=''; render(); }
function closeModal(){document.getElementById('modal').classList.remove('active');}
function openModal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('modal').classList.add('active');}
function goBack(){currentPlayer=null;render();}
function goBackFolder(){currentFolder=null;render();}
function goBackTournament(){currentTournament=null;render();}

function render() {
    var d=getData(),app=document.getElementById('app'),html='';
    if(currentTab==='players')html=renderPlayers(d);
    else if(currentTab==='sale')html=renderSale(d);
    else if(currentTab==='orders')html=renderOrders(d);
    else if(currentTab==='tasks')html=renderTasks(d);
    else if(currentTab==='tournaments')html=renderTournaments(d);
    var lb=d.lastBackup?new Date(d.lastBackup).toLocaleString('ru-RU'):'ещё не было';
    html+='<div class="backup-info">💾 Бэкап (.xlsx): '+lb+' | <span onclick="manualBackup()">Сохранить</span> | <span class="restore-link" onclick="triggerRestore()">📥 Загрузить бэкап</span></div>';
    app.innerHTML=html;
}
function manualBackup(){var d=getData();downloadBackupXLSX('clown_council_backup_' + new Date().toISOString().slice(0,10) + '.xlsx', d);d.lastBackup=new Date().toISOString();saveData(d);render();alert('✅ Бэкап (.xlsx) сохранён!');}

// ── PLAYERS ──
function renderPlayers(d) {
    var h='';
    if(currentPlayer&&d.players[currentPlayer]){var p=d.players[currentPlayer];h+='<div class="back-link" onclick="goBack()">← Назад</div><div class="list-item"><div><h3>'+currentPlayer+'</h3></div><span>'+(p.balance||0)+' ₽</span></div><button class="btn" onclick="showAddFunds()">💰 Пополнить</button><button class="btn btn-gold" onclick="showSpend()">🛒 Покупка из альбома</button><button class="btn btn-accent" onclick="showOrder()">📦 Заказ под привоз</button><button class="btn btn-danger" onclick="deletePlayer()">🗑 Удалить</button><h3 style="margin-top:20px;color:var(--dim);">📋 История</h3>';if(!p.history||!p.history.length)h+='<div class="empty">Нет операций</div>';else{var hist=p.history.slice().reverse();for(var i=0;i<hist.length;i++){var hi=hist[i],s='+',c='text-success';if(hi.type==='spend'){s='−';c='text-danger';}if(hi.type==='order'){s='🔒';c='text-accent';}h+='<div class="history-item"><span class="'+c+'"><b>'+s+(hi.amount||0)+' ₽</b></span> — '+(hi.card||'')+'<br><small>'+(hi.date||'')+'</small></div>';}}}
    else{currentPlayer=null;h+='<button class="btn btn-primary" onclick="showAddPlayer()">+ Добавить игрока</button>';var n=Object.keys(d.players).sort();if(!n.length)h+='<div class="empty">Пока никого нет</div>';else for(var i=0;i<n.length;i++)h+='<div class="list-item" onclick="openPlayer(\''+n[i]+'\')"><div><h3>'+n[i]+'</h3></div><span>'+(d.players[n[i]].balance||0)+' ₽</span></div>';}
    return h;
}
function openPlayer(n){currentPlayer=n;render();}
function showAddPlayer(){openModal('<h2>✨ Новый игрок</h2><input id="pName" placeholder="Имя"><input id="pBal" type="number" value="0"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="addPlayer()">Создать</button></div>');}
function addPlayer(){var n=document.getElementById('pName').value.trim();if(!n)return alert('Введи!');var b=parseInt(document.getElementById('pBal').value)||0;var d=getData();if(d.players[n])return alert('Есть!');d.players[n]={balance:b,history:b>0?[{date:new Date().toLocaleString('ru-RU'),amount:b,type:'add',card:'Старт'}]:[]};saveData(d);closeModal();render();}
function showAddFunds(){openModal('<h2>💰 '+currentPlayer+'</h2><input id="amount" type="number" value="500"><input id="note" placeholder="Примечание"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="addFunds()">Зачислить</button></div>');}
function addFunds(){var a=parseInt(document.getElementById('amount').value)||0;if(a<=0)return;var d=getData();d.players[currentPlayer].balance+=a;d.players[currentPlayer].history.push({date:new Date().toLocaleString('ru-RU'),amount:a,type:'add',card:document.getElementById('note').value.trim()||'Пополнение'});saveData(d);closeModal();render();}
function showSpend(){openModal('<h2>🛒 '+currentPlayer+'</h2><input id="spendCard" placeholder="Карта"><input id="spendAmount" type="number"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-gold" style="background:var(--gold);color:#000;" onclick="spendFunds()">Списать</button></div>');}

function showAddSaleCard(){openModal('<h2>💵 Карта</h2><div class="autocomplete-wrap"><input id="saleName" placeholder="Название" autocomplete="off" oninput="onNameInput()" onkeydown="onNameKeydown(event)"><div class="autocomplete-list" id="autocompleteList"></div></div><p id="oraclePreview"></p><input id="saleSet" placeholder="Сет"><input id="saleCollector" placeholder="Номер"><select id="saleCondition"><option>Near Mint</option><option>Lightly Played</option><option>Moderately Played</option></select><div class="toggle-row"><span>Фойл</span><label class="switch"><input type="checkbox" id="saleFoil"><span class="slider"></span></label></div><input id="salePrice" type="number" placeholder="Цена"><input type="hidden" id="saleOracle"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-sell-btn" onclick="addSaleCard()">Добавить</button></div>');}
function onNameInput(){var v=document.getElementById('saleName').value.trim(),l=document.getElementById('autocompleteList');if(autocompleteTimer)clearTimeout(autocompleteTimer);if(v.length<2){l.style.display='none';return;}autocompleteTimer=setTimeout(function(){fetch('https://api.scryfall.com/cards/autocomplete?q='+encodeURIComponent(v)).then(function(r){return r.json();}).then(function(j){l.innerHTML='';if(j.data&&j.data.length>0){for(var i=0;i<Math.min(j.data.length,8);i++){var d=document.createElement('div');d.textContent=j.data[i];d.onclick=function(){document.getElementById('saleName').value=this.textContent;l.style.display='none';fetchOracle(this.textContent);};l.appendChild(d);}l.style.display='block';}else l.style.display='none';}).catch(function(){l.style.display='none';});},300);}

function fetchOracle(n){var o=document.getElementById('oraclePreview');if(!n)return;o.textContent='...';fetch('https://api.scryfall.com/cards/named?exact='+encodeURIComponent(n)).then(function(r){return r.json();}).then(function(j){if(j.oracle_text){o.textContent='📜 '+j.oracle_text;document.getElementById('saleOracle').value=j.oracle_text;}else o.textContent='-';}).catch(function(){o.textContent='-';});}
function addSaleCard(){var n=document.getElementById('saleName').value.trim();if(!n)return alert('Введи!');var d=getData();d.saleCards.push({id:genId(),name:n,set:document.getElementById('saleSet').value.trim(),collector:document.getElementById('saleCollector').value.trim(),condition:document.getElementById('saleCondition').value,foil:document.getElementById('saleFoil').checked,price:document.getElementById('salePrice').value.trim(),oracle:document.getElementById('saleOracle').value.trim()});saveData(d);closeModal();render();}

function saveSaleCard(id){var d=getData();for(var i=0;i<d.saleCards.length;i++){if(d.saleCards[i].id===id){d.saleCards[i].name=document.getElementById('saleName').value.trim();d.saleCards[i].set=document.getElementById('saleSet').value.trim();d.saleCards[i].collector=document.getElementById('saleCollector').value.trim();d.saleCards[i].condition=document.getElementById('saleCondition').value;d.saleCards[i].foil=document.getElementById('saleFoil').checked;d.saleCards[i].price=document.getElementById('salePrice').value.trim();d.saleCards[i].oracle=document.getElementById('saleOracle').value.trim();break;}}saveData(d);closeModal();render();}

function renderTasks(d){var h='',folds=d.taskFolders||[];if(currentFolder){var fo=null;for(var i=0;i<folds.length;i++){if(folds[i].id===currentFolder){fo=folds[i];break;}}if(!fo){currentFolder=null;return renderTasks(d);}var ts=fo.tasks||[],s=(document.getElementById('searchBox').value||'').toLowerCase(),ft=[];for(var i=0;i<ts.length;i++){if(s===''||(ts[i].title||'').toLowerCase().indexOf(s)!==-1||(ts[i].desc||'').toLowerCase().indexOf(s)!==-1)ft.push(ts[i]);}h+='<div class="breadcrumb"><span onclick="goBackFolder()">📁 Все папки</span> → 📂 '+fo.name+'</div><button class="btn btn-info" onclick="showAddTask()">+ Новая задача</button><div class="stats">📋 Задач: <b>'+ts.length+'</b> | ✅ <b>'+ts.filter(function(t){return t.done;}).length+'</b></div>';if(!ft.length)h+='<div class="empty">'+(ts.length?'Ничего не найдено.':'Папка пуста.')+'</div>';else{ft.sort(function(a,b){return (a.done?1:0)-(b.done?1:0);});for(var i=0;i<ft.length;i++){var t=ft[i];h+='<div class="task-item'+(t.done?' task-done':'')+'"><div style="display:flex;justify-content:space-between;"><h3>'+(t.done?'✅ ':'⬜ ')+(t.title||'')+'</h3>'+(t.price?'<span style="color:var(--gold);">'+t.price+' ₽</span>':'')+'</div>';if(t.desc)h+='<div class="task-meta">'+t.desc+'</div>';if(t.link)h+='<div class="task-link">🔗 <a href="'+t.link+'" target="_blank">'+t.link+'</a></div>';h+='<div class="btn-row" style="margin-top:8px;"><button class="btn btn-small btn-sell-btn" onclick="toggleTask(\''+t.id+'\')">'+(t.done?'↩':'✅')+'</button><button class="btn btn-small btn-price-btn" onclick="editTask(\''+t.id+'\')">✏️</button><button class="btn btn-small" style="background:var(--danger);" onclick="deleteTask(\''+t.id+'\')">🗑</button></div></div>';}}h+='<div style="margin-top:16px;border-top:1px solid #333;padding-top:12px;"><button class="btn btn-warning" onclick="editFolder(\''+fo.id+'\')">✏️</button><button class="btn btn-danger" onclick="deleteFolder(\''+fo.id+'\')">🗑</button></div>';return h;}h+='<button class="btn btn-warning" onclick="showAddFolder()">📁 Новая папка</button>';if(!folds.length)h+='<div class="empty">Нет папок.</div>';else for(var i=0;i<folds.length;i++){var f=folds[i];h+='<div class="folder-item" onclick="openFolder(\''+f.id+'\')"><div><h3>📂 '+(f.name||'Без имени')+'</h3><div class="folder-stats">'+(f.tasks||[]).length+' задач</div></div><span>→</span></div>';}return h;}

function renderTournaments(d) {

    if(currentTournament){
        var trn=null;for(var i=0;i<trns.length;i++){if(trns[i].id===currentTournament){trn=trns[i];break;}}

        var parts=trn.participants||[],pc=parts.filter(function(p){return p.paid;}).length,pf=0;
        for(var i=0;i<parts.length;i++){if(parts[i].paid)pf+=(parseInt(parts[i].entryFee)||500);}

        h+='<div class="prize-fund"><h3>🏆 ПРИЗОВОЙ ФОНД</h3><div class="amount">'+pf.toLocaleString()+' ₽</div><div style="font-size:12px;color:var(--dim);">Оплатили: '+pc+' из '+parts.length+'</div></div>';
        h+='<div class="stats">👥 Игроков: <b>'+parts.length+'</b> | 💰 Оплатили: <b>'+pc+'</b></div>';
        h+='<div style="display:flex;gap:8px;margin-bottom:12px;"><button class="btn btn-tournament" style="flex:1;" onclick="showAddParticipant()">+ Добавить игрока</button><button class="btn btn-export" style="flex:1;" onclick="exportTournament(\''+trn.id+'\')">📥 Excel</button></div>';
        if(!parts.length)h+='<div class="empty">Нет игроков.</div>';
        else for(var i=0;i<parts.length;i++){
            var p=parts[i];
            h+='<div class="participant-row"><div class="info"><h4>👤 '+(p.name||'???')+'</h4>';
            h+='<div class="deck">🔗 '+(p.deckLink?'<a href="'+p.deckLink+'" target="_blank">'+p.deckLink+'</a>':'<span style="color:var(--dim);">—</span>')+'</div>';
            if(p.commander||p.partner||p.companion){h+='<div class="commanders">';if(p.commander)h+='🎖 '+p.commander+' ';if(p.partner)h+='🤝 '+p.partner+' ';if(p.companion)h+='🐾 '+p.companion;h+='</div>';}
            h+='</div><div style="display:flex;align-items:center;gap:8px;"><div class="paid-badge '+(p.paid?'paid':'unpaid')+'" onclick="togglePaid(\''+p.id+'\')">'+(p.paid?'✅ Оплатил':'❌ Не оплатил')+'</div><button class="btn btn-small" style="background:var(--danger);" onclick="deleteParticipant(\''+p.id+'\')">🗑</button></div></div>';
        }
        h+='<div style="margin-top:16px;border-top:1px solid #333;padding-top:12px;"><button class="btn btn-warning" onclick="editTournament(\''+trn.id+'\')">✏️ Переименовать</button><button class="btn btn-danger" onclick="deleteTournament(\''+trn.id+'\')">🗑 Удалить</button></div>';
        return h;
    }
    h+='<button class="btn btn-tournament" onclick="showAddTournament()">🏟 Новая папка турнира</button>';
    if(!trns.length)h+='<div class="empty">Нет папок.</div>';
    else for(var i=0;i<trns.length;i++){var t=trns[i];var pc=(t.participants||[]).length;var pp=(t.participants||[]).filter(function(p){return p.paid;}).length;h+='<div class="folder-item tournament" onclick="openTournament(\''+t.id+'\')"><div><h3>🏟 '+(t.name||'Без имени')+'</h3><div class="folder-stats">'+pc+' игроков, '+pp+' оплатили</div></div><span>→</span></div>';}
    return h;
}
function openTournament(id){currentTournament=id;render();}
function showAddTournament(){openModal('<h2>🏟 Новая папка</h2><input id="trnName" placeholder="Название"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-tournament" onclick="addTournament()">Создать</button></div>');}
function addTournament(){var n=document.getElementById('trnName').value.trim();if(!n)return;var d=getData();d.tournaments.push({id:genId(),name:n,participants:[]});saveData(d);closeModal();render();}
function editTournament(id){var d=getData(),t=null;for(var i=0;i<d.tournaments.length;i++){if(d.tournaments[i].id===id){t=d.tournaments[i];break;}}if(!t)return;openModal('<h2>✏️</h2><input id="trnName" value="'+(t.name||'')+'"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-tournament" onclick="saveTournament(\''+id+'\')">Сохранить</button></div>');}
function saveTournament(id){var n=document.getElementById('trnName').value.trim();if(!n)return;var d=getData();for(var i=0;i<d.tournaments.length;i++){if(d.tournaments[i].id===id){d.tournaments[i].name=n;break;}}saveData(d);closeModal();render();}
function deleteTournament(id){if(!confirm('Удалить?'))return;var d=getData();d.tournaments=d.tournaments.filter(function(t){return t.id!==id;});currentTournament=null;saveData(d);render();}
function showAddParticipant(){openModal('<h2>👤 Игрок</h2><input id="partName" placeholder="Имя"><input id="partDeckLink" placeholder="Ссылка на колоду"><input id="partCommander" placeholder="Командир"><input id="partPartner" placeholder="Партнёр"><input id="partCompanion" placeholder="Компаньон"><input id="partFee" type="number" value="500"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-tournament" onclick="addParticipant()">Добавить</button></div>');}
function addParticipant(){var n=document.getElementById('partName').value.trim();if(!n)return;var d=getData();for(var i=0;i<d.tournaments.length;i++){if(d.tournaments[i].id===currentTournament){d.tournaments[i].participants.push({id:genId(),name:n,deckLink:document.getElementById('partDeckLink').value.trim(),commander:document.getElementById('partCommander').value.trim(),partner:document.getElementById('partPartner').value.trim(),companion:document.getElementById('partCompanion').value.trim(),entryFee:document.getElementById('partFee').value.trim()||'500',paid:false});break;}}saveData(d);closeModal();render();}
function togglePaid(id){var d=getData();for(var i=0;i<d.tournaments.length;i++){if(d.tournaments[i].id===currentTournament){for(var j=0;j<d.tournaments[i].participants.length;j++){if(d.tournaments[i].participants[j].id===id){d.tournaments[i].participants[j].paid=!d.tournaments[i].participants[j].paid;break;}}break;}}saveData(d);render();}
function deleteParticipant(id){if(!confirm('Удалить?'))return;var d=getData();for(var i=0;i<d.tournaments.length;i++){if(d.tournaments[i].id===currentTournament){d.tournaments[i].participants=d.tournaments[i].participants.filter(function(p){return p.id!==id;});break;}}saveData(d);render();}
function exportTournament(id){
    var d=getData(),trn=null;for(var i=0;i<d.tournaments.length;i++){if(d.tournaments[i].id===id){trn=d.tournaments[i];break;}}if(!trn)return;
    var p=trn.participants||[],pc=p.filter(function(x){return x.paid;}).length,pf=0;
    for(var i=0;i<p.length;i++){if(p[i].paid)pf+=(parseInt(p[i].entryFee)||500);}
    var data = [['Турнир:', trn.name||''], ['Призовой фонд:', pf+' ₽'], ['Оплатили:', pc+' из '+p.length], [], ['Игрок', 'Ссылка на колоду', 'Командир', 'Партнёр', 'Компаньон', 'Взнос', 'Статус']];
    for(var i=0;i<p.length;i++){data.push([p[i].name||'', p[i].deckLink||'', p[i].commander||'', p[i].partner||'', p[i].companion||'', (p[i].entryFee||'500')+' ₽', p[i].paid?'Оплатил':'Не оплатил']);}
    ensureXLSX(function() {
        var wb = XLSX.utils.book_new();
        var ws = XLSX.utils.aoa_to_sheet(data);
        XLSX.utils.book_append_sheet(wb, ws, 'Турнир');
        XLSX.writeFile(wb, (trn.name||'tournament')+'.xlsx');
    });
}

checkAutoBackup();render();
</script>
</body>
</html>
