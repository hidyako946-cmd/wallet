<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Clown's Council</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #141414;
            --gold: #c9a44b;
            --gold-light: #e0c878;
            --text: #e0d6c2;
            --dim: #7a7a7a;
            --accent: #7b5ea7;
            --danger: #8b3a3a;
            --success: #3a6b4a;
            --info: #3a6b8b;
            --warning: #8b7a3a;
            --tournament: #2a6b4a;
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            padding: 16px; padding-bottom: 120px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .header { text-align: center; margin: 20px 0 24px; }
        .header h1 { font-size: 26px; color: var(--gold); letter-spacing: 1px; }

        /* Tabs */
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
        .tabs button {
            flex: 1; min-width: 55px; padding: 12px 4px; background: var(--card-bg);
            border: 1px solid #222; color: var(--dim); font-size: 11px; font-weight: bold;
            border-radius: 12px; cursor: pointer; white-space: nowrap;
        }
        .tabs button.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* Cards */
        .list-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 16px;
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid #444; cursor: pointer;
        }
        .list-item h3 { font-size: 17px; }
        .list-item span { font-size: 20px; font-weight: bold; color: white; }

        /* Folder / Tournament card */
        .folder-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 16px;
            margin-bottom: 12px; border: 1px solid #333; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid var(--warning);
        }
        .folder-item.tournament { border-left-color: var(--tournament); }
        .folder-item h3 { font-size: 16px; }
        .folder-item .folder-stats { font-size: 13px; color: var(--dim); }

        /* Participant row */
        .participant-row {
            background: var(--card-bg); border-radius: 12px; padding: 14px;
            margin-bottom: 8px; border: 1px solid #222;
        }
        .participant-row .info h4 { font-size: 15px; margin-bottom: 2px; }
        .participant-row .info .deck { font-size: 12px; color: var(--dim); }
        .participant-row .info .commanders { font-size: 11px; color: var(--accent); margin-top: 2px; }
        .participant-row .paid-badge {
            padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold;
            cursor: pointer; border: 2px solid #333; min-width: 90px; text-align: center;
            transition: all 0.2s; display: inline-block; margin-top: 6px;
        }
        .paid-badge.paid { background: var(--success); border-color: var(--success); color: white; }
        .paid-badge.unpaid { background: transparent; border-color: var(--danger); color: var(--danger); }

        /* Prize fund */
        .prize-fund {
            background: linear-gradient(135deg, #1a3a2a, #0a1a0a);
            border: 2px solid var(--tournament); border-radius: var(--radius);
            padding: 16px; margin: 16px 0; text-align: center;
        }
        .prize-fund h3 { font-size: 14px; color: var(--dim); margin-bottom: 4px; }
        .prize-fund .amount { font-size: 28px; font-weight: bold; color: var(--gold); }

        /* Sale card */
        .sale-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 16px;
            margin-bottom: 12px; border: 1px solid #222;
        }
        .sale-item h3 { font-size: 17px; color: var(--gold-light); margin-bottom: 4px; }
        .sale-item .oracle { font-size: 12px; color: var(--dim); margin: 6px 0; padding: 8px; background: #0a0a0a; border-radius: 8px; font-style: italic; line-height: 1.4; }
        .sale-item .price { font-size: 20px; font-weight: bold; color: white; }
        .sale-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .sale-actions button { flex: 1; min-width: 60px; }

        /* Autocomplete */
        .autocomplete-wrap { position: relative; }
        .autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 10;
            background: #1a1a1a; border: 1px solid #333; border-radius: 0 0 10px 10px;
            max-height: 200px; overflow-y: auto; display: none;
        }
        .autocomplete-list div { padding: 10px 14px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #222; color: #ccc; }
        .autocomplete-list div:hover { background: var(--accent); color: white; }

        /* Task card */
        .task-item {
            background: var(--card-bg); border-radius: var(--radius); padding: 14px;
            margin-bottom: 8px; border: 1px solid #222;
        }
        .task-item h3 { font-size: 15px; color: var(--text); margin-bottom: 4px; }
        .task-item .task-meta { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
        .task-item .task-link { font-size: 11px; color: var(--info); word-break: break-all; }
        .task-done { opacity: 0.5; }
        .task-done h3 { text-decoration: line-through; }

        /* Buttons */
        .btn {
            background: var(--card-bg); border: 1px solid #333; color: white;
            padding: 14px; border-radius: 12px; font-size: 15px; font-weight: bold;
            width: 100%; margin-top: 8px; cursor: pointer; text-align: center; display: block;
        }
        .btn-primary { background: var(--accent); border: none; }
        .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn-info { background: var(--info); border: none; color: white; }
        .btn-gold { background: transparent; border-color: var(--gold); color: var(--gold); }
        .btn-accent { background: transparent; border-color: var(--accent); color: var(--accent); }
        .btn-warning { background: var(--warning); border: none; color: white; }
        .btn-tournament { background: var(--tournament); border: none; color: white; }
        .btn-sell-btn { background: var(--success); color: white; border: none; }
        .btn-price-btn { background: var(--accent); color: white; border: none; }
        .btn-small { padding: 8px 12px; font-size: 12px; width: auto; display: inline-block; margin: 4px; }
        .btn-export { background: #1a5c2a; border: 1px solid var(--success); color: var(--success); }
        .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: var(--card-bg); width: 90%; max-width: 420px; padding: 24px;
            border-radius: 20px; border: 1px solid #333; max-height: 85vh; overflow-y: auto;
        }
        .modal-box h2 { color: var(--gold); margin-bottom: 16px; font-size: 20px; }
        input, select, textarea {
            width: 100%; padding: 14px; margin: 8px 0; background: #000;
            border: 1px solid #333; color: white; border-radius: 10px; font-size: 15px; outline: none;
        }
        textarea { resize: vertical; min-height: 80px; font-family: monospace; font-size: 11px; }
        .row { display: flex; gap: 8px; margin-top: 16px; }
        .row .btn { flex: 1; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; }
        .switch { position: relative; display: inline-block; width: 52px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; border-radius: 28px; cursor: pointer; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: 0.2s; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(24px); }
        .back-link { color: var(--gold); margin-bottom: 12px; display: block; cursor: pointer; font-weight: bold; }
        .history-item { padding: 10px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .history-item small { color: #555; }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-accent { color: var(--accent); }
        .empty { text-align: center; margin-top: 40px; color: var(--dim); }
        .stats { font-size: 13px; color: var(--dim); margin-bottom: 12px; }
        .breadcrumb { font-size: 13px; color: var(--dim); margin-bottom: 12px; }
        .breadcrumb span { color: var(--gold); cursor: pointer; }
        .backup-info { font-size: 11px; color: #444; text-align: center; margin-top: 8px; }
    </style>
</head>
<body>

<div class="header">
    <h1>🎪 The Clown's Council</h1>
</div>

<div class="tabs">
    <button id="tabPlayers" class="active" onclick="switchTab('players')">🧙</button>
    <button id="tabSale" onclick="switchTab('sale')">💵</button>
    <button id="tabOrders" onclick="switchTab('orders')">📦</button>
    <button id="tabTasks" onclick="switchTab('tasks')">📋</button>
    <button id="tabTournaments" onclick="switchTab('tournaments')">🏆</button>
</div>

<input type="text" class="search-box" id="searchBox" placeholder="🔍 Поиск..." style="display:none;" oninput="render()">

<div id="app"></div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-box" id="modalContent"></div>
</div>

<script>
    // ──────────────────────────────────────
    // ХРАНИЛИЩЕ
    // ──────────────────────────────────────
    var STORE = 'clown_council_v6';

    function getData() {
        var raw = localStorage.getItem(STORE);
        if (!raw) return { players: {}, orders: [], saleCards: [], taskFolders: [], tournaments: [], lastBackup: null };
        try { return JSON.parse(raw); } catch(e) { return { players: {}, orders: [], saleCards: [], taskFolders: [], tournaments: [], lastBackup: null }; }
    }

    function saveData(data) {
        try { localStorage.setItem(STORE, JSON.stringify(data)); }
        catch(e) { alert('Память переполнена!'); }
    }

    function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

    // ──────────────────────────────────────
    // АВТОСОХРАНЕНИЕ РАЗ В НЕДЕЛЮ
    // ──────────────────────────────────────
    function checkAutoBackup() {
        var data = getData();
        var now = new Date();
        var last = data.lastBackup ? new Date(data.lastBackup) : null;
        var oneWeek = 7 * 24 * 60 * 60 * 1000;

        if (!last || (now - last) >= oneWeek) {
            performBackup(data);
            data.lastBackup = now.toISOString();
            saveData(data);
        }
    }

    function performBackup(data) {
        var csv = '\uFEFF';
        csv += '=== The Clown\'s Council - БЭКАП ===\n';
        csv += 'Дата: ' + new Date().toLocaleString('ru-RU') + '\n\n';

        // Игроки
        csv += '--- ИГРОКИ ---\n';
        csv += 'Имя,Баланс\n';
        var pnames = Object.keys(data.players).sort();
        for (var i = 0; i < pnames.length; i++) {
            csv += pnames[i] + ',' + (data.players[pnames[i]].balance || 0) + '\n';
        }

        // На продажу
        csv += '\n--- НА ПРОДАЖУ ---\n';
        csv += 'Название,Сет,Номер,Состояние,Фойл,Цена\n';
        for (var i = 0; i < data.saleCards.length; i++) {
            var c = data.saleCards[i];
            csv += '"' + (c.name||'') + '","' + (c.set||'') + '","' + (c.collector||'') + '","' + (c.condition||'') + '","' + (c.foil?'Да':'Нет') + '","' + (c.price||'') + '"\n';
        }

        // Заказы
        csv += '\n--- ЗАКАЗЫ ---\n';
        csv += 'Игрок,Карта,Сумма,Статус,Дата\n';
        for (var i = 0; i < data.orders.length; i++) {
            var o = data.orders[i];
            csv += '"' + (o.playerName||'') + '","' + (o.card||'') + '",' + (o.amount||0) + ',"' + (o.status||'') + '","' + (o.date||'') + '"\n';
        }

        // Задачи
        csv += '\n--- ЗАДАЧИ ---\n';
        csv += 'Папка,Задача,Описание,Цена,Ссылка,Выполнено\n';
        for (var i = 0; i < data.taskFolders.length; i++) {
            var f = data.taskFolders[i];
            for (var j = 0; j < f.tasks.length; j++) {
                var t = f.tasks[j];
                csv += '"' + (f.name||'') + '","' + (t.title||'') + '","' + (t.desc||'') + '","' + (t.price||'') + '","' + (t.link||'') + '","' + (t.done?'Да':'Нет') + '"\n';
            }
        }

        // Турниры
        csv += '\n--- ТУРНИРЫ ---\n';
        for (var i = 0; i < data.tournaments.length; i++) {
            var trn = data.tournaments[i];
            csv += '\nТурнир: ' + (trn.name||'') + '\n';
            csv += 'Игрок,Колода,Командир,Партнёр,Компаньон,Оплата\n';
            for (var j = 0; j < trn.participants.length; j++) {
                var p = trn.participants[j];
                csv += '"' + (p.name||'') + '","' + (p.deck||'') + '","' + (p.commander||'') + '","' + (p.partner||'') + '","' + (p.companion||'') + '","' + (p.paid?'Оплатил':'Не оплатил') + '"\n';
            }
        }

        // Скачиваем
        downloadFile('clown_council_backup_' + new Date().toISOString().slice(0,10) + '.csv', csv);
    }

    function downloadFile(filename, content) {
        var blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    // ──────────────────────────────────────
    // НАВИГАЦИЯ
    // ──────────────────────────────────────
    var currentTab = 'players';
    var currentPlayer = null;
    var currentFolder = null;
    var currentTournament = null;

    function switchTab(tab) {
        currentTab = tab;
        currentPlayer = null;
        currentFolder = null;
        currentTournament = null;
        var tabs = ['players','sale','orders','tasks','tournaments'];
        for (var i = 0; i < tabs.length; i++) {
            document.getElementById('tab' + tabs[i].charAt(0).toUpperCase() + tabs[i].slice(1)).className = (tab === tabs[i]) ? 'active' : '';
        }
        document.getElementById('searchBox').style.display = (tab === 'sale' || tab === 'tasks') ? 'block' : 'none';
        if (tab !== 'sale' && tab !== 'tasks') document.getElementById('searchBox').value = '';
        render();
    }

    function closeModal() { document.getElementById('modal').classList.remove('active'); }
    function openModal(html) {
        document.getElementById('modalContent').innerHTML = html;
        document.getElementById('modal').classList.add('active');
    }
    function goBack() { currentPlayer = null; render(); }
    function goBackFolder() { currentFolder = null; render(); }
    function goBackTournament() { currentTournament = null; render(); }

    // ──────────────────────────────────────
    // РЕНДЕР
    // ──────────────────────────────────────
    function render() {
        var data = getData();
        var app = document.getElementById('app');
        var html = '';
        if (currentTab === 'players') html = renderPlayers(data);
        else if (currentTab === 'sale') html = renderSale(data);
        else if (currentTab === 'orders') html = renderOrders(data);
        else if (currentTab === 'tasks') html = renderTasks(data);
        else if (currentTab === 'tournaments') html = renderTournaments(data);

        // Инфа о бэкапе
        var lastBackup = data.lastBackup ? new Date(data.lastBackup).toLocaleString('ru-RU') : 'ещё не было';
        html += '<div class="backup-info">💾 Автобэкап раз в неделю | Последний: ' + lastBackup + ' | <span style="color:var(--gold);cursor:pointer;" onclick="manualBackup()">Сделать сейчас</span></div>';

        app.innerHTML = html;
    }

    function manualBackup() {
        var data = getData();
        performBackup(data);
        data.lastBackup = new Date().toISOString();
        saveData(data);
        render();
        alert('Бэкап сохранён!');
    }

    // ──────────────────────────────────────
    // ВКЛАДКА: ИГРОКИ
    // ──────────────────────────────────────
    function renderPlayers(data) {
        var html = '';
        if (currentPlayer && data.players[currentPlayer]) {
            var p = data.players[currentPlayer];
            html += '<div class="back-link" onclick="goBack()">← Назад</div>';
            html += '<div class="list-item"><div><h3>' + currentPlayer + '</h3></div><span>' + (p.balance || 0) + ' ₽</span></div>';
            html += '<button class="btn" onclick="showAddFunds()">💰 Пополнить</button>';
            html += '<button class="btn btn-gold" onclick="showSpend()">🛒 Покупка из альбома</button>';
            html += '<button class="btn btn-accent" onclick="showOrder()">📦 Заказ под привоз</button>';
            html += '<button class="btn btn-danger" onclick="deletePlayer()">🗑 Удалить</button>';
            html += '<h3 style="margin-top:20px;color:var(--dim);">📋 История</h3>';
            if (!p.history || p.history.length === 0) html += '<div class="empty">Нет операций</div>';
            else {
                var hist = p.history.slice().reverse();
                for (var i = 0; i < hist.length; i++) {
                    var h = hist[i];
                    var sign = '+'; var cls = 'text-success';
                    if (h.type === 'spend') { sign = '−'; cls = 'text-danger'; }
                    if (h.type === 'order') { sign = '🔒'; cls = 'text-accent'; }
                    html += '<div class="history-item"><span class="' + cls + '"><b>' + sign + (h.amount || 0) + ' ₽</b></span> — ' + (h.card || '') + '<br><small>' + (h.date || '') + '</small></div>';
                }
            }
        } else {
            currentPlayer = null;
            html += '<button class="btn btn-primary" onclick="showAddPlayer()">+ Добавить игрока</button>';
            var names = Object.keys(data.players).sort();
            if (names.length === 0) html += '<div class="empty">Пока никого нет</div>';
            else for (var i = 0; i < names.length; i++) html += '<div class="list-item" onclick="openPlayer(\'' + names[i] + '\')"><div><h3>' + names[i] + '</h3></div><span>' + (data.players[names[i]].balance || 0) + ' ₽</span></div>';
        }
        return html;
    }
    function openPlayer(name) { currentPlayer = name; render(); }

    // ──────────────────────────────────────
    // ВКЛАДКА: НА ПРОДАЖУ
    // ──────────────────────────────────────
    function renderSale(data) {
        var html = '';
        var search = (document.getElementById('searchBox').value || '').toLowerCase();
        var cards = data.saleCards || [];
        var filtered = [];
        for (var i = 0; i < cards.length; i++) {
            var c = cards[i];
            if (search === '' || (c.name||'').toLowerCase().indexOf(search) !== -1 || (c.oracle||'').toLowerCase().indexOf(search) !== -1) filtered.push(c);
        }
        html += '<div class="stats">💵 Карт: <b>' + cards.length + '</b> | Показано: <b>' + filtered.length + '</b></div>';
        html += '<button class="btn btn-sell-btn" onclick="showAddSaleCard()">+ Добавить карту</button>';
        if (cards.length > 0) html += '<button class="btn btn-danger" style="margin-top:4px;" onclick="clearSale()">🗑 Очистить</button>';
        if (filtered.length === 0) html += '<div class="empty">' + (cards.length === 0 ? 'Пусто.' : 'Ничего не найдено.') + '</div>';
        else for (var i = 0; i < filtered.length; i++) {
            var c = filtered[i];
            html += '<div class="sale-item"><h3>🃏 ' + (c.name||'???') + '</h3>';
            if (c.set||c.collector) { html += '<div class="meta">'; if (c.set) html += '<span>📗 '+c.set.toUpperCase()+'</span>'; if (c.collector) html += '<span>#'+c.collector+'</span>'; if (c.foil) html += '<span style="color:var(--gold);">✨ FOIL</span>'; html += '</div>'; }
            if (c.oracle) html += '<div class="oracle">'+c.oracle+'</div>';
            html += '<div class="price">'+(c.price ? c.price+' ₽' : '<span class="no-price">Цена не задана</span>')+'</div>';
            html += '<div class="sale-actions"><button class="btn btn-small btn-sell-btn" onclick="sellToPlayer(\''+c.id+'\')">💵</button><button class="btn btn-small btn-price-btn" onclick="setSalePrice(\''+c.id+'\')">💰</button><button class="btn btn-small" style="background:var(--info);" onclick="editSaleCard(\''+c.id+'\')">✏️</button><button class="btn btn-small" style="background:var(--danger);" onclick="deleteSaleCard(\''+c.id+'\')">🗑</button></div></div>';
        }
        return html;
    }

    // ──────────────────────────────────────
    // ВКЛАДКА: ЗАКАЗЫ
    // ──────────────────────────────────────
    function renderOrders(data) {
        var html = '', pending = [], done = [];
        for (var i = 0; i < data.orders.length; i++) { if (data.orders[i].status === 'pending') pending.push(data.orders[i]); else done.push(data.orders[i]); }
        html += '<button class="btn btn-primary" onclick="showAddOrder()">+ Новый заказ</button>';
        if (pending.length === 0 && done.length === 0) html += '<div class="empty">📭 Заказов нет</div>';
        if (pending.length > 0) {
            html += '<h3 style="color:var(--accent);margin:16px 0 8px;">⏳ Ожидают ('+pending.length+')</h3>';
            for (var i = 0; i < pending.length; i++) {
                var o = pending[i];
                html += '<div class="list-item" style="border-left-color:var(--accent);"><div><b>'+o.playerName+'</b><br>'+o.card+'<br><small>'+o.date+'</small></div><div style="text-align:right;"><span>'+o.amount+' ₽</span><br><button class="btn btn-small" style="background:var(--success);" onclick="completeOrder(\''+o.id+'\')">✅</button><button class="btn btn-small" style="background:var(--danger);" onclick="deleteOrder(\''+o.id+'\')">🗑</button></div></div>';
            }
        }
        if (done.length > 0) {
            html += '<h3 style="color:var(--dim);margin-top:16px;">✅ Выполненные</h3>';
            for (var i = done.length-1; i >= Math.max(0, done.length-5); i--) html += '<div class="list-item" style="opacity:0.6;"><div><b>'+done[i].playerName+'</b><br>'+done[i].card+'</div><div>'+done[i].amount+' ₽</div></div>';
        }
        return html;
    }

    // ──────────────────────────────────────
    // ВКЛАДКА: ЗАДАЧИ
    // ──────────────────────────────────────
    function renderTasks(data) {
        var html = '', folders = data.taskFolders || [];
        if (currentFolder) {
            var folder = null;
            for (var i = 0; i < folders.length; i++) { if (folders[i].id === currentFolder) { folder = folders[i]; break; } }
            if (!folder) { currentFolder = null; return renderTasks(data); }
            var tasks = folder.tasks || [];
            var search = (document.getElementById('searchBox').value || '').toLowerCase();
            var filtered = [];
            for (var i = 0; i < tasks.length; i++) { if (search === '' || (tasks[i].title||'').toLowerCase().indexOf(search) !== -1 || (tasks[i].desc||'').toLowerCase().indexOf(search) !== -1) filtered.push(tasks[i]); }
            html += '<div class="breadcrumb"><span onclick="goBackFolder()">📁 Все папки</span> → 📂 ' + folder.name + '</div>';
            html += '<button class="btn btn-info" onclick="showAddTask()">+ Новая задача</button>';
            html += '<div class="stats">📋 Задач: <b>'+tasks.length+'</b> | ✅ <b>'+tasks.filter(function(t){return t.done;}).length+'</b></div>';
            if (filtered.length === 0) html += '<div class="empty">'+(tasks.length===0?'Папка пуста.':'Ничего не найдено.')+'</div>';
            else {
                filtered.sort(function(a,b){return (a.done?1:0)-(b.done?1:0);});
                for (var i = 0; i < filtered.length; i++) {
                    var t = filtered[i];
                    html += '<div class="task-item'+(t.done?' task-done':'')+'"><div style="display:flex;justify-content:space-between;"><h3>'+(t.done?'✅ ':'⬜ ')+(t.title||'')+'</h3>'+(t.price?'<span style="color:var(--gold);">'+t.price+' ₽</span>':'')+'</div>';
                    if (t.desc) html += '<div class="task-meta">'+t.desc+'</div>';
                    if (t.link) html += '<div class="task-link">🔗 <a href="'+t.link+'" target="_blank">'+t.link+'</a></div>';
                    html += '<div class="btn-row" style="margin-top:8px;"><button class="btn btn-small btn-sell-btn" onclick="toggleTask(\''+t.id+'\')">'+(t.done?'↩':'✅')+'</button><button class="btn btn-small btn-price-btn" onclick="editTask(\''+t.id+'\')">✏️</button><button class="btn btn-small" style="background:var(--danger);" onclick="deleteTask(\''+t.id+'\')">🗑</button></div></div>';
                }
            }
            html += '<div style="margin-top:16px;border-top:1px solid #333;padding-top:12px;"><button class="btn btn-warning" onclick="editFolder(\''+folder.id+'\')">✏️ Переименовать</button><button class="btn btn-danger" onclick="deleteFolder(\''+folder.id+'\')">🗑 Удалить папку</button></div>';
            return html;
        }
        html += '<button class="btn btn-warning" onclick="showAddFolder()">📁 Новая папка</button>';
        if (folders.length === 0) html += '<div class="empty">Нет папок.</div>';
        else for (var i = 0; i < folders.length; i++) {
            var f = folders[i];
            html += '<div class="folder-item" onclick="openFolder(\''+f.id+'\')"><div><h3>📂 '+ (f.name||'Без имени') +'</h3><div class="folder-stats">'+(f.tasks||[]).length+' задач, '+f.tasks.filter(function(t){return t.done;}).length+' выполнено</div></div><span style="color:var(--dim);">→</span></div>';
        }
        return html;
    }
    function openFolder(id) { currentFolder = id; render(); }

    // ──────────────────────────────────────
    // ВКЛАДКА: ТУРНИРЫ
    // ──────────────────────────────────────
    function renderTournaments(data) {
        var html = '';
        var tournaments = data.tournaments || [];

        if (currentTournament) {
            var trn = null;
            for (var i = 0; i < tournaments.length; i++) { if (tournaments[i].id === currentTournament) { trn = tournaments[i]; break; } }
            if (!trn) { currentTournament = null; return renderTournaments(data); }

            var participants = trn.participants || [];
            var paidCount = participants.filter(function(p){return p.paid;}).length;
            var prizeFund = 0;
            for (var i = 0; i < participants.length; i++) { if (participants[i].paid) prizeFund += (parseInt(participants[i].entryFee) || 500); }

            html += '<div class="breadcrumb"><span onclick="goBackTournament()">🏆 Все турниры</span> → 🏟 ' + trn.name + '</div>';

            // Призовой фонд
            html += '<div class="prize-fund"><h3>🏆 ПРИЗОВОЙ ФОНД</h3><div class="amount">' + prizeFund.toLocaleString() + ' ₽</div><div style="font-size:12px;color:var(--dim);">Оплатили: ' + paidCount + ' чел.</div></div>';

            html += '<div class="stats">👥 Участников: <b>' + participants.length + '</b> | 💰 Оплатили: <b>' + paidCount + '</b></div>';

            html += '<div style="display:flex;gap:8px;margin-bottom:12px;">';
            html += '<button class="btn btn-tournament" style="flex:1;" onclick="showAddParticipant()">+ Добавить игрока</button>';
            html += '<button class="btn btn-export" style="flex:1;" onclick="exportTournament(\'' + trn.id + '\')">📥 Excel</button>';
            html += '</div>';

            if (participants.length === 0) {
                html += '<div class="empty">Нет участников.</div>';
            } else {
                for (var i = 0; i < participants.length; i++) {
                    var p = participants[i];
                    html += '<div class="participant-row">';
                    html += '<div class="info"><h4>👤 ' + (p.name || '???') + '</h4>';
                    html += '<div class="deck">🃏 Колода: ' + (p.deck || '—') + '</div>';
                    if (p.commander || p.partner || p.companion) {
                        html += '<div class="commanders">';
                        if (p.commander) html += '🎖 Командир: ' + p.commander + ' ';
                        if (p.partner) html += '🤝 Партнёр: ' + p.partner + ' ';
                        if (p.companion) html += '🐾 Компаньон: ' + p.companion;
                        html += '</div>';
                    }
                    html += '</div>';
                    html += '<div style="display:flex;align-items:center;gap:8px;">';
                    html += '<div class="paid-badge ' + (p.paid ? 'paid' : 'unpaid') + '" onclick="togglePaid(\'' + p.id + '\')">' + (p.paid ? '✅ Оплатил' : '❌ Не оплатил') + '</div>';
                    html += '<button class="btn btn-small" style="background:var(--danger);" onclick="deleteParticipant(\'' + p.id + '\')">🗑</button>';
                    html += '</div>';
                    html += '</div>';
                }
            }

            html += '<div style="margin-top:16px;border-top:1px solid #333;padding-top:12px;">';
            html += '<button class="btn btn-warning" onclick="editTournament(\'' + trn.id + '\')">✏️ Переименовать</button>';
            html += '<button class="btn btn-danger" onclick="deleteTournament(\'' + trn.id + '\')">🗑 Удалить турнир</button>';
            html += '</div>';
            return html;
        }

        html += '<button class="btn btn-tournament" onclick="showAddTournament()">🏟 Новый турнир</button>';
        if (tournaments.length === 0) html += '<div class="empty">Нет турниров.</div>';
        else for (var i = 0; i < tournaments.length; i++) {
            var t = tournaments[i];
            var pCount = (t.participants || []).length;
            var pPaid = (t.participants || []).filter(function(p){return p.paid;}).length;
            html += '<div class="folder-item tournament" onclick="openTournament(\'' + t.id + '\')"><div><h3>🏟 ' + (t.name || 'Без имени') + '</h3><div class="folder-stats">' + pCount + ' игроков, ' + pPaid + ' оплатили</div></div><span style="color:var(--dim);">→</span></div>';
        }
        return html;
    }

    function showAddPlayer() { openModal('<h2>✨ Новый игрок</h2><input id="pName" placeholder="Имя"><input id="pBal" type="number" value="0"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="addPlayer()">Создать</button></div>'); }
    function addPlayer() {
        var name = document.getElementById('pName').value.trim(); if (!name) return alert('Введи!');
        var bal = parseInt(document.getElementById('pBal').value) || 0; var data = getData();
        if (data.players[name]) return alert('Есть!');
        data.players[name] = { balance: bal, history: bal > 0 ? [{ date: new Date().toLocaleString('ru-RU'), amount: bal, type: 'add', card: 'Старт' }] : [] };
        saveData(data); closeModal(); render();
    }
    function showAddFunds() { openModal('<h2>💰 '+currentPlayer+'</h2><input id="amount" type="number" value="500"><input id="note" placeholder="Примечание"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="addFunds()">Зачислить</button></div>'); }
    function addFunds() {
        var amount = parseInt(document.getElementById('amount').value) || 0; if (amount <= 0) return;
        var data = getData(); data.players[currentPlayer].balance += amount;
        data.players[currentPlayer].history.push({ date: new Date().toLocaleString('ru-RU'), amount: amount, type: 'add', card: document.getElementById('note').value.trim()||'Пополнение' });
        saveData(data); closeModal(); render();
    }
    function showSpend() { openModal('<h2>🛒 '+currentPlayer+'</h2><input id="spendCard" placeholder="Карта"><input id="spendAmount" type="number"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-gold" style="background:var(--gold);color:#000;" onclick="spendFunds()">Списать</button></div>'); }
    function spendFunds() {
        var amount = parseInt(document.getElementById('spendAmount').value) || 0; if (amount <= 0) return;
        var data = getData(); if (data.players[currentPlayer].balance < amount) return alert('Недостаточно!');
        data.players[currentPlayer].balance -= amount;
        data.players[currentPlayer].history.push({ date: new Date().toLocaleString('ru-RU'), amount: amount, type: 'spend', card: document.getElementById('spendCard').value.trim()||'Карта' });

    }
    function showOrder() { openModal('<h2>📦 '+currentPlayer+'</h2><input id="orderCard" placeholder="Карта"><input id="orderBase" type="number" placeholder="Цена" oninput="updateOrderTotal()"><div class="toggle-row"><span>+20%</span><label class="switch"><input type="checkbox" id="orderComm" checked onchange="updateOrderTotal()"><span class="slider"></span></label></div><p style="text-align:right;">Итог: <b id="orderTotal">0 ₽</b></p><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-accent" style="background:var(--accent);" onclick="placeOrderFromPlayer()">Заказать</button></div>'); }
    function updateOrderTotal() { document.getElementById('orderTotal').innerText = ((document.getElementById('orderComm').checked ? Math.round((parseInt(document.getElementById('orderBase').value)||0) * 1.2) : (parseInt(document.getElementById('orderBase').value)||0))) + ' ₽'; }
    function placeOrderFromPlayer() {
        var card = document.getElementById('orderCard').value.trim(); var base = parseInt(document.getElementById('orderBase').value)||0; var comm = document.getElementById('orderComm').checked; var total = comm ? Math.round(base*1.2) : base;
        if (!card || total <= 0) return alert('Заполни!'); var data = getData();
        if (data.players[currentPlayer].balance < total) return alert('Недостаточно!');
        data.players[currentPlayer].balance -= total;
        data.players[currentPlayer].history.push({ date: new Date().toLocaleString('ru-RU'), amount: total, type: 'order', card: card+' (ЗАКАЗ)' });
        data.orders.push({ id: genId(), playerName: currentPlayer, card: card, amount: total, status: 'pending', date: new Date().toLocaleString('ru-RU') });

    }

    var autocompleteTimer = null;
    function showAddSaleCard() { openModal('<h2>💵 Карта</h2><div class="autocomplete-wrap"><input id="saleName" placeholder="Название" autocomplete="off" oninput="onNameInput()" onkeydown="onNameKeydown(event)"><div class="autocomplete-list" id="autocompleteList"></div></div><p id="oraclePreview" class="oracle-loading"></p><input id="saleSet" placeholder="Сет"><input id="saleCollector" placeholder="Номер"><select id="saleCondition"><option>Near Mint</option><option>Lightly Played</option><option>Moderately Played</option></select><div class="toggle-row"><span>Фойл</span><label class="switch"><input type="checkbox" id="saleFoil"><span class="slider"></span></label></div><input id="salePrice" type="number" placeholder="Цена"><input type="hidden" id="saleOracle"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-sell-btn" onclick="addSaleCard()">Добавить</button></div>'); }
    function onNameInput() {
        var val = document.getElementById('saleName').value.trim(); var list = document.getElementById('autocompleteList');
        if (autocompleteTimer) clearTimeout(autocompleteTimer);
        if (val.length < 2) { list.style.display = 'none'; return; }
        autocompleteTimer = setTimeout(function() {
            fetch('https://api.scryfall.com/cards/autocomplete?q='+encodeURIComponent(val)).then(function(r){return r.json();}).then(function(json){
                list.innerHTML = ''; if (json.data && json.data.length > 0) { for (var i=0;i<Math.min(json.data.length,8);i++){var d=document.createElement('div');d.textContent=json.data[i];d.onclick=function(){document.getElementById('saleName').value=this.textContent;list.style.display='none';fetchOracle(this.textContent);};list.appendChild(d);} list.style.display='block'; } else list.style.display='none';
            }).catch(function(){list.style.display='none';});
        }, 300);
    }
    function onNameKeydown(e) { if(e.key==='Enter'){e.preventDefault();var f=document.getElementById('autocompleteList').querySelector('div');if(f)f.click();else fetchOracle(document.getElementById('saleName').value.trim());} }
    function fetchOracle(name) { var o=document.getElementById('oraclePreview');if(!name)return;o.textContent='Загрузка...';fetch('https://api.scryfall.com/cards/named?exact='+encodeURIComponent(name)).then(function(r){return r.json();}).then(function(j){if(j.oracle_text){o.textContent='📜 '+j.oracle_text;document.getElementById('saleOracle').value=j.oracle_text;}else o.textContent='Не найдено';}).catch(function(){o.textContent='Ошибка';}); }
    function addSaleCard() { var n=document.getElementById('saleName').value.trim();if(!n)return alert('Введи!');var data=getData();data.saleCards.push({id:genId(),name:n,set:document.getElementById('saleSet').value.trim(),collector:document.getElementById('saleCollector').value.trim(),condition:document.getElementById('saleCondition').value,foil:document.getElementById('saleFoil').checked,price:document.getElementById('salePrice').value.trim(),oracle:document.getElementById('saleOracle').value.trim()});saveData(data);closeModal();render();}
    function editSaleCard(id){var d=getData(),c=null;for(var i=0;i<d.saleCards.length;i++){if(d.saleCards[i].id===id){c=d.saleCards[i];break;}}if(!c)return;openModal('<h2>✏️</h2><input id="saleName" value="'+(c.name||'')+'"><input id="saleSet" value="'+(c.set||'')+'"><input id="saleCollector" value="'+(c.collector||'')+'"><select id="saleCondition"><option'+(c.condition==='Near Mint'?' selected':'')+'>Near Mint</option><option'+(c.condition==='Lightly Played'?' selected':'')+'>Lightly Played</option><option'+(c.condition==='Moderately Played'?' selected':'')+'>Moderately Played</option></select><div class="toggle-row"><span>Фойл</span><label class="switch"><input type="checkbox" id="saleFoil"'+(c.foil?' checked':'')+'><span class="slider"></span></label></div><input id="salePrice" type="number" value="'+(c.price||'')+'"><textarea id="saleOracle">'+(c.oracle||'')+'</textarea><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-sell-btn" onclick="saveSaleCard(\''+id+'\')">Сохранить</button></div>');}
    function saveSaleCard(id){var d=getData();for(var i=0;i<d.saleCards.length;i++){if(d.saleCards[i].id===id){d.saleCards[i].name=document.getElementById('saleName').value.trim();d.saleCards[i].set=document.getElementById('saleSet').value.trim();d.saleCards[i].collector=document.getElementById('saleCollector').value.trim();d.saleCards[i].condition=document.getElementById('saleCondition').value;d.saleCards[i].foil=document.getElementById('saleFoil').checked;d.saleCards[i].price=document.getElementById('salePrice').value.trim();d.saleCards[i].oracle=document.getElementById('saleOracle').value.trim();break;}}saveData(d);closeModal();render();}

    function saveSalePrice(id){var d=getData();for(var i=0;i<d.saleCards.length;i++){if(d.saleCards[i].id===id){d.saleCards[i].price=document.getElementById('newPrice').value.trim();break;}}saveData(d);closeModal();render();}

    function saveFolder(id){var n=document.getElementById('folderName').value.trim();if(!n)return;var d=getData();for(var i=0;i<d.taskFolders.length;i++){if(d.taskFolders[i].id===id){d.taskFolders[i].name=n;break;}}saveData(d);closeModal();render();}

    function showAddTask(){openModal('<h2>📋 Задача</h2><input id="taskTitle" placeholder="Название"><textarea id="taskDesc" placeholder="Описание"></textarea><input id="taskPrice" type="number" placeholder="Цена"><input id="taskLink" placeholder="Ссылка"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-info" onclick="addTask()">Создать</button></div>');}
    function addTask(){var t=document.getElementById('taskTitle').value.trim();if(!t)return alert('Введи!');var d=getData();for(var i=0;i<d.taskFolders.length;i++){if(d.taskFolders[i].id===currentFolder){d.taskFolders[i].tasks.push({id:genId(),title:t,desc:document.getElementById('taskDesc').value.trim(),price:document.getElementById('taskPrice').value.trim(),link:document.getElementById('taskLink').value.trim(),done:false,date:new Date().toLocaleString('ru-RU')});break;}}saveData(d);closeModal();render();}
    function editTask(id){var d=getData(),t=null;for(var i=0;i<d.taskFolders.length;i++){if(d.taskFolders[i].id===currentFolder){for(var j=0;j<d.taskFolders[i].tasks.length;j++){if(d.taskFolders[i].tasks[j].id===id){t=d.taskFolders[i].tasks[j];break;}}break;}}if(!t)return;openModal('<h2>✏️</h2><input id="taskTitle" value="'+(t.title||'')+'"><textarea id="taskDesc">'+(t.desc||'')+'</textarea><input id="taskPrice" type="number" value="'+(t.price||'')+'"><input id="taskLink" value="'+(t.link||'')+'"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-info" onclick="saveTask(\''+id+'\')">Сохранить</button></div>');}
    function saveTask(id){var d=getData();for(var i=0;i<d.taskFolders.length;i++){if(d.taskFolders[i].id===currentFolder){for(var j=0;j<d.taskFolders[i].tasks.length;j++){if(d.taskFolders[i].tasks[j].id===id){d.taskFolders[i].tasks[j].title=document.getElementById('taskTitle').value.trim();d.taskFolders[i].tasks[j].desc=document.getElementById('taskDesc').value.trim();d.taskFolders[i].tasks[j].price=document.getElementById('taskPrice').value.trim();d.taskFolders[i].tasks[j].link=document.getElementById('taskLink').value.trim();break;}}break;}}saveData(d);closeModal();render();}
    function toggleTask(id){var d=getData();for(var i=0;i<d.taskFolders.length;i++){if(d.taskFolders[i].id===currentFolder){for(var j=0;j<d.taskFolders[i].tasks.length;j++){if(d.taskFolders[i].tasks[j].id===id){d.taskFolders[i].tasks[j].done=!d.taskFolders[i].tasks[j].done;break;}}break;}}saveData(d);render();}
    function deleteTask(id){if(!confirm('Удалить?'))return;var d=getData();for(var i=0;i<d.taskFolders.length;i++){if(d.taskFolders[i].id===currentFolder){d.taskFolders[i].tasks=d.taskFolders[i].tasks.filter(function(t){return t.id!==id;});break;}}saveData(d);render();}

    // ──────────────────────────────────────
    // МОДАЛКИ: ТУРНИРЫ
    // ──────────────────────────────────────
    function showAddTournament() { openModal('<h2>🏟 Новый турнир</h2><input id="trnName" placeholder="Название"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-tournament" onclick="addTournament()">Создать</button></div>'); }
    function addTournament() { var n = document.getElementById('trnName').value.trim(); if (!n) return alert('Введи!'); var d = getData(); d.tournaments.push({ id: genId(), name: n, participants: [] }); saveData(d); closeModal(); render(); }
    function editTournament(id) { var d = getData(), t = null; for (var i = 0; i < d.tournaments.length; i++) { if (d.tournaments[i].id === id) { t = d.tournaments[i]; break; } } if (!t) return; openModal('<h2>✏️</h2><input id="trnName" value="'+(t.name||'')+'"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-tournament" onclick="saveTournament(\''+id+'\')">Сохранить</button></div>'); }
    function saveTournament(id) { var n = document.getElementById('trnName').value.trim(); if (!n) return; var d = getData(); for (var i = 0; i < d.tournaments.length; i++) { if (d.tournaments[i].id === id) { d.tournaments[i].name = n; break; } } saveData(d); closeModal(); render(); }
    function deleteTournament(id) { if (!confirm('Удалить?')) return; var d = getData(); d.tournaments = d.tournaments.filter(function(t) { return t.id !== id; }); currentTournament = null; saveData(d); render(); }

    function showAddParticipant() {
        openModal('<h2>👤 Игрок</h2><input id="partName" placeholder="Имя игрока"><input id="partDeck" placeholder="Название колоды"><input id="partCommander" placeholder="Командир"><input id="partPartner" placeholder="Партнёр"><input id="partCompanion" placeholder="Компаньон"><input id="partFee" type="number" placeholder="Взнос (₽)" value="500"><div class="row"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-tournament" onclick="addParticipant()">Добавить</button></div>');
    }
    function addParticipant() {
        var name = document.getElementById('partName').value.trim();
        if (!name) return alert('Введи имя!');
        var d = getData();
        for (var i = 0; i < d.tournaments.length; i++) {
            if (d.tournaments[i].id === currentTournament) {
                d.tournaments[i].participants.push({
                    id: genId(),
                    name: name,
                    deck: document.getElementById('partDeck').value.trim(),
                    commander: document.getElementById('partCommander').value.trim(),
                    partner: document.getElementById('partPartner').value.trim(),
                    companion: document.getElementById('partCompanion').value.trim(),
                    entryFee: document.getElementById('partFee').value.trim() || '500',
                    paid: false
                });
                break;
            }
        }
        saveData(d); closeModal(); render();
    }

    function togglePaid(id) {
        var d = getData();
        for (var i = 0; i < d.tournaments.length; i++) {
            if (d.tournaments[i].id === currentTournament) {
                for (var j = 0; j < d.tournaments[i].participants.length; j++) {
                    if (d.tournaments[i].participants[j].id === id) {
                        d.tournaments[i].participants[j].paid = !d.tournaments[i].participants[j].paid;
                        break;
                    }
                }
                break;
            }
        }
        saveData(d); render();
    }

    function deleteParticipant(id) {
        if (!confirm('Удалить?')) return;
        var d = getData();
        for (var i = 0; i < d.tournaments.length; i++) {
            if (d.tournaments[i].id === currentTournament) {
                d.tournaments[i].participants = d.tournaments[i].participants.filter(function(p) { return p.id !== id; });
                break;
            }
        }
        saveData(d); render();
    }

    // ──────────────────────────────────────
    // ЭКСПОРТ ТУРНИРА В CSV (EXCEL)
    // ──────────────────────────────────────
    function exportTournament(id) {
        var d = getData();
        var trn = null;
        for (var i = 0; i < d.tournaments.length; i++) { if (d.tournaments[i].id === id) { trn = d.tournaments[i]; break; } }
        if (!trn) return;

        var participants = trn.participants || [];
        var paidCount = participants.filter(function(p){return p.paid;}).length;
        var prizeFund = 0;
        for (var i = 0; i < participants.length; i++) { if (participants[i].paid) prizeFund += (parseInt(participants[i].entryFee) || 500); }

        var csv = '\uFEFF';
        csv += 'Турнир:,' + (trn.name || '') + '\n';
        csv += 'Дата экспорта:,' + new Date().toLocaleString('ru-RU') + '\n';
        csv += 'Призовой фонд:,' + prizeFund + ' ₽\n';
        csv += 'Оплатили:,' + paidCount + ' из ' + participants.length + '\n\n';

        // Каждое поле в своей ячейке
        csv += 'Игрок,Колода,Командир,Партнёр,Компаньон,Взнос,Статус оплаты\n';
        for (var i = 0; i < participants.length; i++) {
            var p = participants[i];
            csv += '"' + (p.name || '') + '"';
            csv += ',"' + (p.deck || '') + '"';
            csv += ',"' + (p.commander || '') + '"';
            csv += ',"' + (p.partner || '') + '"';
            csv += ',"' + (p.companion || '') + '"';
            csv += ',"' + (p.entryFee || '500') + ' ₽"';
            csv += ',"' + (p.paid ? 'Оплатил' : 'Не оплатил') + '"\n';
        }

        downloadFile((trn.name || 'tournament') + '.csv', csv);
    }

    // ──────────────────────────────────────
    // ЗАПУСК: проверка бэкапа при старте
    // ──────────────────────────────────────
    checkAutoBackup();
    render();
</script>
